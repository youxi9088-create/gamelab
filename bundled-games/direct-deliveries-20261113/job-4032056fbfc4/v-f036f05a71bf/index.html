<!DOCTYPE html>
<html lang="en">
  <head>
	
	
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taxi Sort: City Rush</title>
    
    
    <link href="./_remote/3a125e88c76c9347/css2" rel="stylesheet">
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; padding: 0; background: #6fb6d6; overflow: hidden; }
      body { touch-action: none; font-family: Inter, system-ui, sans-serif; color: #fff; }
      canvas { display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui button { pointer-events: auto; font-family: Inter, sans-serif; font-weight: 800; border: none; cursor: pointer; }
      .pill { background: rgba(20, 24, 36, .78); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
      #hud { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: calc(env(safe-area-inset-left) + 10px); right: calc(env(safe-area-inset-right) + 10px); display: none; flex-direction: column; gap: 6px; }
      #hud .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      #hud .pill { padding: 6px 10px; font-size: clamp(12px, 3.5vw, 15px); }
      #hud .grow { flex: 1; }
      #levelLabel { max-width: 44vw; }
      .statRow .stat { flex: 1 1 0; justify-content: center; }
      .hudIcon { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(20,24,36,.78); color: #fff; font-size: 18px; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
      #timerWrap { height: 8px; background: rgba(20,24,36,.7); border-radius: 8px; overflow: hidden; }
      #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #ffc81e, #ff8c1a); transition: background .3s; }
      #hud .row .pill { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #muteBtn { background: #2ed573; border: 2px solid #fff !important; transition: background .15s, transform .1s; }
      #muteBtn:active { transform: scale(.92); }
      #muteBtn.off { background: #ff4757; }
      @media (max-width: 360px), (max-height: 640px) {
        #hud .pill { padding: 5px 8px; font-size: 11px; }
        .hudIcon { flex-basis: 34px; width: 34px; height: 34px; font-size: 15px; }
        .btn { min-height: 44px !important; font-size: 14px !important; }
      }
      #bottomBar { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 12px); left: calc(env(safe-area-inset-left) + 10px); right: calc(env(safe-area-inset-right) + 10px); display: none; justify-content: space-between; gap: 10px; }
      .btn { min-height: 52px; padding: 0 16px; border-radius: 16px; font-size: 16px; color: #2b2100; background: #ffc81e; box-shadow: 0 5px 0 #b8860b; flex: 1; }
      .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
      .btn.dark { background: #2c3550; color: #fff; box-shadow: 0 5px 0 #161b2b; }
      .btn.green { background: #2ed573; color: #08341a; box-shadow: 0 5px 0 #1a8a48; }
      .node.special { width: auto; padding: 0 12px; border-radius: 16px; font-size: 14px; }
      .langBtn.sel { outline: 3px solid #ffc81e; }
      .btn.ad::before { content: '▶ ' attr(data-ad); font-size: 11px; background: #fff; color: #222; border-radius: 6px; padding: 2px 5px; margin-right: 5px; vertical-align: middle; }
      .btn:disabled { opacity: .45; }
      .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 14, 28, .6); pointer-events: auto; }
      .card { width: min(86vw, 420px); background: #fff; color: #222; border-radius: 24px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 0 rgba(0,0,0,.2); }
      .card h2 { margin: 0; font-family: Orbitron, sans-serif; font-size: 26px; }
      .card p { margin: 0; font-size: 16px; color: #555; }
      #map { background: #2a6f97 url('assets/city-map-bg.webp') center/cover; align-items: stretch; flex-direction: column; }
      #mapHead { padding: max(5vh, env(safe-area-inset-top)) 5vw 10px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(rgba(10,14,28,.85), rgba(10,14,28,0)); }
      #mapHead h1 { font-family: Orbitron, sans-serif; font-size: 22px; margin: 0; text-shadow: 0 3px 0 #000; line-height: 1.1; }
      #mapHead h1 span { color: #ffc81e; }
      #mapScroll { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 10px 6vw 22vh; }
      .district { background: rgba(10,14,28,.72); border-radius: 20px; padding: 12px; margin-bottom: 16px; }
      .district h3 { margin: 0 0 10px; font-family: Orbitron, sans-serif; font-size: 16px; color: #ffc81e; }
      .nodes { display: flex; justify-content: space-between; }
      .node { width: 52px; height: 52px; border-radius: 50%; font-size: 18px; background: #fff; color: #222; box-shadow: 0 4px 0 #999; }
      .node.done { background: #2ed573; color: #fff; box-shadow: 0 4px 0 #1a8a48; }
      .node.current { background: #ffc81e; box-shadow: 0 4px 0 #b8860b; animation: pulse 1s infinite; }
      .node.locked { background: #555; color: #999; box-shadow: 0 4px 0 #333; }
      @keyframes pulse { 50% { transform: scale(1.12); } }
      #mapFoot { position: absolute; bottom: max(5vh, env(safe-area-inset-bottom)); left: 6vw; right: 6vw; display: flex; gap: 10px; }
      .skin { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: #f1f2f6; }
      .skin .sw { width: 40px; height: 40px; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 0 0 2px #ccc; }
      .skin .nm { flex: 1; text-align: left; font-weight: 800; }
      .skin button { min-height: 44px; flex: 0 0 110px; }
      #adBox { width: min(86vw, 420px); aspect-ratio: 9/12; background: repeating-linear-gradient(45deg, #222 0 20px, #2b2b2b 20px 40px); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-weight: 800; }
      #adCount { font-family: Orbitron, sans-serif; font-size: 48px; color: #ffc81e; }
      #questPanel { align-self: stretch; background: rgba(20,24,36,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 5px 6px 5px 10px; pointer-events: auto; transition: background .4s, box-shadow .4s, transform .4s; max-width: 100%; box-sizing: border-box; }
      #questPanel.hl { background: rgba(20,24,36,.88); box-shadow: 0 0 0 2px #ffc81e, 0 6px 18px rgba(0,0,0,.35); }
      #questPanel.min { align-self: flex-start; margin-right: 0; padding: 4px 6px 4px 10px; }
      #questPanel.min #qpChips, #questPanel.min #qpInfo, #questPanel.min #qpDetails { display: none; }
      #qpRow { display: flex; align-items: center; gap: 6px; min-width: 0; }
      #qpTitle { flex: 0 0 auto; font-weight: 800; font-size: clamp(11px, 3vw, 13px); color: #ffc81e; white-space: nowrap; }
      #qpChips { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
      #qpChips::-webkit-scrollbar { display: none; }
      .qpChip { flex: 0 0 auto; font-size: clamp(10px, 2.8vw, 12px); font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.12); white-space: nowrap; }
      .qpChip.done { background: rgba(46,213,115,.3); color: #b9ffd4; }
      .qpBtn { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; font-size: 13px; font-weight: 800; padding: 0; line-height: 28px; }
      #qpDetails { display: none; margin-top: 6px; font-size: clamp(11px, 3vw, 13px); line-height: 1.35; color: #e8ebf3; }
      #qpDetails div { padding: 2px 0; }
      #questPanel.open #qpDetails { display: block; }
      #questPanel { display: none !important; } /* mission UI hidden during gameplay */
      #toast { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 72px); left: 50%; transform: translateX(-50%); background: rgba(20,24,36,.82); padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: clamp(12px, 3.4vw, 15px); opacity: 0; transition: opacity .25s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      #coinFly { position: absolute; font-size: 30px; font-weight: 800; color: #ffc81e; text-shadow: 0 3px 0 #000; left: 50%; top: 45%; transform: translate(-50%, -50%); opacity: 0; transition: all .8s ease; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="ui">
      <div id="hud">
        <div class="row topRow">
          <span class="pill" id="levelLabel">1</span>
          <span class="pill">🪙 <span id="coinLabel">0</span></span>
          <span class="grow"></span>
          <button id="muteBtn" class="hudIcon" aria-pressed="false">🔊</button>
          <button id="hudSettingsBtn" class="hudIcon">⚙</button>
        </div>
        <div id="timerWrap"><div id="timerBar"></div></div>
        <div class="row statRow">
          <span class="pill stat" id="paxLabel">🧍 0</span>
          <span class="pill stat" id="timeLabel">⏱ 0</span>
          <span class="pill stat" id="sentLabel">🚕 0</span>
          <span class="pill stat" id="slotLabel">🅿 0/4</span>
        </div>
        <div id="questPanel">
          <div id="qpRow">
            <span id="qpTitle"></span>
            <div id="qpChips"></div>
            <button id="qpInfo" class="qpBtn" aria-label="info">▾</button>
            <button id="qpMin" class="qpBtn" aria-label="minimize">—</button>
          </div>
          <div id="qpDetails"></div>
        </div>
      </div>
      <div id="bottomBar">
        <button class="btn dark" id="mapBtn" style="flex:0 0 64px">🗺</button>
        
        
      </div>
      <div id="toast"></div>
      <div id="coinFly"></div>

      <div class="overlay" id="map">
        <div id="mapHead">
          <h1><span data-i18n="title1" style="color:#fff">TAXI SORT</span><br><span data-i18n="title2">CITY RUSH</span></h1>
          <span style="display:flex;gap:6px;align-items:center"><span class="pill">🪙 <span id="mapCoins">0</span></span><button id="mapSettingsBtn" style="width:44px;height:44px;border-radius:50%;background:rgba(20,24,36,.78);color:#fff;font-size:18px">⚙</button></span>
        </div>
        <div id="mapScroll"></div>
        <div id="mapFoot">
          <button class="btn dark" id="missionsBtn" data-i18n="daily">📅 Daily</button>
          <button class="btn dark" id="shopBtn" data-i18n="skins">🚕 Skins</button>
          <button class="btn green" id="playBtn">Play</button>
        </div>
      </div>

      <div class="overlay" id="shop">
        <div class="card">
          <h2 data-i18n="skinsTitle">Taxi Skins</h2>
          <p>🪙 <b id="shopCoins">0</b></p>
          <div id="skinList" style="display:flex;flex-direction:column;gap:8px"></div>
          <button class="btn dark" id="shopClose" data-i18n="back">Back</button>
        </div>
      </div>

      <div class="overlay" id="missions">
        <div class="card">
          <h2 data-i18n="missionsTitle">Daily Missions</h2>
          <p data-i18n="missionsSub">New missions every day</p>
          <div id="missionList" style="display:flex;flex-direction:column;gap:8px"></div>
          <button class="btn dark" id="missionsClose" data-i18n="back">Back</button>
        </div>
      </div>

      <div class="overlay" id="settings">
        <div class="card">
          <h2 data-i18n="settings">Settings</h2>
          <p><b data-i18n="language">Language</b></p>
          <div id="langList" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
          <p><b data-i18n="sound">Sound</b></p>
          <button class="btn" id="soundToggle">On</button>
          <button class="btn dark" id="settingsClose" data-i18n="back">Back</button>
        </div>
      </div>

      <div class="overlay" id="win">
        <div class="card">
          <h2 id="winTitle">City Cleared! 🎉</h2>
          <div id="badgeRow" style="font-size:40px"></div>
          <p id="statLine" style="font-size:13px"></p>
          <div id="goalList" style="display:flex;flex-direction:column;gap:4px;font-size:14px"></div>
          <p id="winText">+0 coins</p>
          
          <button class="btn green" id="nextBtn">Next Level</button>
          <button class="btn dark" id="winMapBtn" data-i18n="cityMap">City Map</button>
        </div>
      </div>

      <div class="overlay" id="lose">
        <div class="card">
          <h2 id="loseTitle">Jammed!</h2>
          <p id="loseText">The waiting area is full.</p>
          
          <button class="btn green" id="retryBtn" data-i18n="retry">Retry</button>
          <button class="btn dark" id="loseMapBtn" data-i18n="cityMap">City Map</button>
        </div>
      </div>

      <div class="overlay" id="ad" style="background:rgba(0,0,0,.92);flex-direction:column;gap:16px">
        <div id="adBox">
          <div style="opacity:.7" data-i18n="adPlaceholder">REWARDED AD PLACEHOLDER</div>
          <div id="adReward" style="font-size:20px"></div>
          <div id="adCount">3</div>
        </div>
        
      </div>
    </div>
    <script type="module" src="./main.js"></script>
    
    
    
    
  </body>
</html>
