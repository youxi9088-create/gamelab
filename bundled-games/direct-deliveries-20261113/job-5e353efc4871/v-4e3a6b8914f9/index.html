    <div id="app">
      <div class="bg" aria-hidden="true">
        <div class="glow g1"></div>

        <div class="floor-wrap"><div class="floor"><div class="floor-lines"></div></div></div>
      </div>

      <header class="top">
        <div class="logo" aria-label="Tic Tac Toe Ultimate">
          <span class="lg-t">TIC TAC TOE</span><span class="lg-u">ULTIMATE</span>
        </div>
        <div class="top-r">
          <button id="bSkins" class="ib" aria-label="Skins"></button>
          <button id="bStats" class="ib" aria-label="Stats"></button>
          <button id="bSound" class="ib" aria-label="Sound"></button>
          <button id="bHelp" class="ib" aria-label="How to play"></button>
          <button id="bLang" class="ib lang" aria-label="Language"></button>
        </div>
      </header>

      <section class="score">
        <div class="pl" id="pl1"><div class="pm"></div><div class="pn"></div><div class="ps">0</div></div>
        <div class="mid">
          <div class="dr"><span id="drLabel"></span><b id="sDraw">0</b></div>
          <div id="streak" class="streak"></div>
        </div>
        <div class="pl" id="pl2"><div class="pm"></div><div class="pn"></div><div class="ps">0</div></div>
      </section>

      <div class="status"><div class="st-txt"><div id="status"></div><div id="sub"></div></div></div>

      <main class="stage" id="stage">
        <div class="board" id="board"></div>
      </main>

      <footer class="ctrl">
        <div class="modes" id="modes"></div>
        <div class="row2">
          <div class="seg" id="opp"></div>
          <div class="seg" id="levels"></div>
        </div>
      </footer>

      <div id="flash" aria-hidden="true"></div>
      <div id="toast" role="status"></div>
      <div id="overlay"></div>

        <div class="logo big"><span class="lg-t">TIC TAC TOE</span><span class="lg-u">ULTIMATE</span></div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
