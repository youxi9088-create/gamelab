<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="utf-8" />
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#102b35" />
    <meta
      name="description"
      content="Two teams, two tiny cars each. Toybox Rally: 2v2 arcade team racing on three toy tracks for 1–4 players."
    />
    <link rel="icon" href="data:,"><title>Toybox Rally</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #102b35;
        --cream: #f6f0e3;
        --muted: #a1b5bb;
        --blue: #5adbe6;
        --orange: #ffb776;
        font-family: "Avenir Next", "Trebuchet MS", Arial, sans-serif;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      button {
        transition:
          background 0.15s,
          transform 0.15s,
          border-color 0.15s;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px);
      }
      [hidden] {
        display: none !important;
      }
      .icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        container: ui/size;
        color: var(--cream);
        pointer-events: none;
      }
      #ui button,
      #ui select,
      #ui input,
      #ui a {
        pointer-events: auto;
      }
      button svg {
        pointer-events: none;
      }
      .menu {
        height: 100%;
        padding: 0 4.3%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          90deg,
          rgba(8, 27, 36, 0.91) 0%,
          rgba(8, 27, 36, 0.65) 32%,
          rgba(8, 27, 36, 0.1) 54%,
          rgba(8, 27, 36, 0.18) 100%
        );
        pointer-events: auto;
      }
      .menu-header {
        height: 90px;
        display: flex;
        align-items: center;
        gap: 32px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(246, 240, 227, 0.14);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--cream);
        text-decoration: none;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 1.2px;
      }
      .brand .icon {
        width: 35px;
        height: 35px;
        color: var(--blue);
      }
      .brand b,
      .race-brand b {
        color: var(--blue);
      }
      .header-note {
        font-size: 9px;
        color: #bdc8c9;
        letter-spacing: 2px;
        font-weight: 700;
      }
      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 41, 52, 0.7);
        border: 1px solid rgba(223, 239, 235, 0.2);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-weight: 800;
      }
      .icon-button:hover {
        background: #295662;
      }
      .menu-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 35px;
        padding: 24px 0;
      }
      .intro {
        width: 41%;
        max-width: 480px;
        padding-bottom: 18px;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.9px;
        color: #c5d2cf;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .tiny-dot {
        display: inline-block;
        background: var(--blue);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        box-shadow: 0 0 12px #5adbe655;
      }
      h1 {
        font-family: "Arial Black", "Avenir Next", Arial, sans-serif;
        letter-spacing: -6px;
        font-size: clamp(72px, 8.9cqw, 137px);
        line-height: 0.88;
        margin: 28px 0 23px;
        font-weight: 1000;
        font-style: italic;
        text-shadow: 0 3px 20px #08212d33;
      }
      h1 > span {
        color: var(--blue);
      }
      .title-dot {
        color: var(--orange);
      }
      .intro > p {
        font-size: 17px;
        line-height: 1.6;
        color: #d5ddd7;
        margin: 0 0 30px;
      }
      .car-choice-label {
        display: flex;
        justify-content: space-between;
        max-width: 385px;
        font-size: 10px;
        letter-spacing: 1.8px;
        font-weight: 800;
        color: #c4cfcd;
        margin-bottom: 12px;
      }
      .car-choice-label span {
        color: var(--blue);
        letter-spacing: 1px;
      }
      .car-choices {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        max-width: 395px;
      }
      .car-choice {
        position: relative;
        background: rgba(17, 44, 53, 0.75);
        border: 1px solid #65818855;
        border-radius: 10px;
        padding: 12px 6px 9px;
        font-size: 8px;
        color: #b1c3c8;
        min-height: 77px;
      }
      .car-choice > .icon {
        width: 36px;
        height: 30px;
        display: block;
        margin: 0 auto 9px;
      }
      .car-choice > span {
        display: block;
      }
      .car-choice.active {
        background: #315762;
        border-color: var(--blue);
        color: var(--cream);
      }
      .car-choice .car-check {
        position: absolute;
        right: 4px;
        top: 4px;
        width: 12px;
        height: 12px;
        margin: 0;
        color: var(--blue);
      }
      .intro > .car-fair {
        font-size: 9px;
        color: #9bb0b7;
        margin: 10px 0 0;
        line-height: 1.4;
      }
      .race-panel {
        width: 500px;
        max-width: 47%;
        background: rgba(13, 36, 46, 0.93);
        padding: 27px;
        border: 1px solid #c2d9d526;
        border-radius: 20px;
        box-shadow: 0 20px 80px #08212d40;
        max-height: 100%;
        overflow: auto;
        scrollbar-width: thin;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 17px;
      }
      .chip {
        font-size: 9px;
        color: var(--orange);
        border: 1px solid #ffb77645;
        border-radius: 5px;
        padding: 5px 7px;
        letter-spacing: 1px;
      }
      .map-choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .map-card {
        text-align: left;
        background: transparent;
        padding: 0;
        border: 1px solid #819eaa30;
        border-radius: 9px;
        overflow: hidden;
        color: #b8cace;
      }
      .map-art {
        height: 90px;
        position: relative;
        overflow: hidden;
        background: #273f46;
        color: var(--map-color);
        padding: 8px 17px;
      }
      .map-bedroom {
        background: linear-gradient(135deg, #735e48, #384b48);
      }
      .map-kitchen {
        background: linear-gradient(135deg, #a8a58c, #5c6862);
      }
      .map-backyard {
        background: linear-gradient(135deg, #577c54, #294e3f);
      }
      .track-outline {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 3px 3px #102b3566);
      }
      .map-num {
        position: absolute;
        right: 8px;
        top: 8px;
        font-size: 9px;
        font-weight: 800;
        color: #fff8;
      }
      .map-name {
        display: block;
        padding: 11px 8px 0;
        font-size: 10px;
        line-height: 1.35;
        font-weight: 800;
      }
      .map-kind {
        display: block;
        padding: 5px 8px 11px;
        font-size: 7px;
        letter-spacing: 1.1px;
        color: #94acb0;
      }
      .map-card.selected {
        border-color: var(--blue);
        color: var(--cream);
        background: #264d58;
      }
      .map-card.selected .map-kind {
        color: var(--blue);
      }
      .segmented {
        display: flex;
        background: #09212b;
        border: 1px solid #44636d66;
        border-radius: 9px;
        padding: 4px;
        margin-top: 20px;
        gap: 3px;
      }
      .segmented > button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: transparent;
        font-size: 10px;
        font-weight: 700;
        padding: 10px 3px;
        color: #97afb8;
        border-radius: 6px;
        white-space: nowrap;
      }
      .segmented > button .icon {
        width: 17px;
        height: 17px;
      }
      .segmented > button.selected {
        background: #345962;
        color: var(--cream);
        box-shadow: 0 2px 6px #0002;
      }
      .mode-explanation {
        font-size: 10px;
        color: #a8bfc4;
        margin: 11px 0 0;
        line-height: 1.5;
      }
      .player-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 9px;
        letter-spacing: 1px;
        margin-top: 15px;
      }
      .count-buttons {
        display: flex;
        gap: 5px;
      }
      .count-buttons button {
        width: 30px;
        height: 26px;
        background: #234550;
        border: 1px solid #6c929b44;
        border-radius: 5px;
      }
      .count-buttons .selected {
        background: var(--blue);
        color: var(--ink);
        font-weight: bold;
      }
      .binding-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
        margin-top: 10px;
      }
      .binding {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 9px;
        color: var(--blue);
      }
      select {
        color: var(--cream);
        background: #1b3b46;
        border: 1px solid #64808b55;
        border-radius: 6px;
        padding: 7px;
        font-size: 10px;
        min-width: 0;
      }
      .binding select {
        flex: 1;
        width: 90%;
      }
      .solo-binding {
        margin-top: 12px;
        max-width: 200px;
      }
      .options-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 18px 0 19px;
      }
      .switch-row {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #a6bbc1;
        background: transparent;
        font-size: 9px;
        padding: 0;
      }
      .switch {
        width: 25px;
        height: 14px;
        border-radius: 10px;
        background: #46616a;
        position: relative;
        transition: background 0.15s;
      }
      .switch:after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        position: absolute;
        left: 2px;
        top: 2px;
        background: #b7c9cf;
        transition: left 0.15s;
      }
      .switch-row.on .switch {
        background: var(--blue);
      }
      .switch-row.on .switch:after {
        left: 13px;
        background: var(--ink);
      }
      .switch-row.on {
        color: #e0e8df;
      }
      .primary-button {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        min-height: 53px;
        padding: 16px 19px;
        border-radius: 9px;
        background: var(--blue);
        color: #0c2b36;
        font-size: 12px;
        letter-spacing: 1px;
        font-weight: 900;
        box-shadow: 0 4px 0 #308995;
      }
      .primary-button:hover {
        background: #8aedf2;
      }
      .start-hint {
        font-size: 8px;
        text-align: center;
        color: #90aab2;
        margin-top: 13px;
        letter-spacing: 0.3px;
      }
      .menu-footer {
        height: 60px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-top: 1px solid #dce3d51a;
        font-size: 8px;
        letter-spacing: 1.2px;
        color: #b4c4c4;
      }
      .menu-footer > span:first-child {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .menu-footer .icon {
        height: 14px;
        width: 14px;
        color: var(--blue);
      }
      .menu-footer i {
        font-style: normal;
        color: var(--blue);
        margin: 0 10px;
      }
      .menu-footer button {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 9px;
        background: none;
        letter-spacing: 1px;
        color: #dbe5df;
      }
      .hud-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        text-shadow: 0 2px 5px #04131d44;
      }
      .race-topbar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 57px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 20px;
        background: linear-gradient(#102b35dd, #102b3500);
        z-index: 2;
      }
      .race-brand {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .team-live {
        display: flex;
        align-items: center;
        gap: 13px;
        background: #102b35ba;
        border: 1px solid #fff2;
        padding: 9px 17px;
        border-radius: 8px;
        font-size: 8px;
        letter-spacing: 1px;
      }
      .team-live b {
        font-size: 15px;
        margin-left: 5px;
      }
      .blue-total {
        color: var(--blue);
      }
      .red-total {
        color: #ff9d88;
      }
      .team-live i {
        font-style: normal;
        color: #aec3c5;
      }
      .race-topbar .icon-button {
        width: 33px;
        height: 33px;
      }
      .race-topbar .icon {
        width: 14px;
        height: 14px;
      }
      .player-hud {
        position: absolute;
        border: 0;
        pointer-events: none;
        padding: 20px;
        overflow: hidden;
      }
      .speed-lines {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.25s;
        background: repeating-conic-gradient(
          from 0deg at 50% 46%,
          rgba(255, 255, 255, 0.55) 0 0.4deg,
          transparent 0.4deg 4.5deg
        );
        -webkit-mask: radial-gradient(ellipse at 50% 46%, transparent 38%, #000 85%);
        mask: radial-gradient(ellipse at 50% 46%, transparent 38%, #000 85%);
        animation: speedspin 0.18s steps(3) infinite;
        z-index: 0;
      }
      @keyframes speedspin {
        to {
          transform: rotate(2deg) scale(1.02);
        }
      }
      .finish-banner {
        position: absolute;
        left: 50%;
        top: 22%;
        transform: translate(-50%, -30px) scale(0.6);
        opacity: 0;
        text-align: center;
        color: #fff;
        transition: all 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
        z-index: 3;
      }
      .finish-banner.show {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      .finish-banner b {
        display: block;
        font-size: clamp(40px, 8cqw, 92px);
        font-weight: 900;
        letter-spacing: 0.04em;
        text-shadow:
          0 6px 0 #0b2a35,
          0 0 30px rgba(63, 216, 255, 0.6);
      }
      .finish-banner.gold b {
        color: #ffd24a;
        text-shadow:
          0 6px 0 #6b4a00,
          0 0 40px rgba(255, 210, 74, 0.8);
      }
      .finish-banner small {
        font-size: 15px;
        letter-spacing: 0.2em;
        font-weight: 800;
        background: #102b35cc;
        padding: 6px 14px;
        border-radius: 20px;
      }
      .finish-banner .flag {
        display: block;
        margin: 0 auto 6px;
        width: 56px;
        height: 34px;
        background: conic-gradient(#fff 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0/14px 14px;
        border-radius: 4px;
        animation: flagwave 0.6s ease-in-out infinite alternate;
      }
      @keyframes flagwave {
        to {
          transform: skewY(-8deg) rotate(4deg);
        }
      }
      .paint-button {
        pointer-events: auto;
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px 9px 10px;
        border-radius: 22px;
        border: 1px solid #f6f0e355;
        background: #102b35cc;
        color: #f6f0e3;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.14em;
        cursor: pointer;
      }
      .paint-button:hover {
        border-color: #f7c35c;
        color: #f7c35c;
      }
      .paint-button small {
        font-size: 9px;
        opacity: 0.65;
        letter-spacing: 0.12em;
      }
      .paint-dots {
        display: flex;
      }
      .paint-dots i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--c);
        border: 2px solid #102b35;
        margin-left: -5px;
        box-shadow: 0 0 0 1px #f6f0e355;
      }
      .paint-dots i:first-child {
        margin-left: 0;
      }
      .menu.painting .race-panel {
        opacity: 0;
        pointer-events: none;
      }
      .modal-root.paint-stage {
        justify-content: flex-end;
        background: none;
        backdrop-filter: none;
        padding: 80px 3%;
      }
      .modal-root.paint-stage:has(.modal) {
        background: linear-gradient(90deg, transparent 42%, #061d2baa);
        backdrop-filter: none;
      }
      .modal-root .modal.paint-modal {
        pointer-events: auto;
        width: min(390px, 92cqw);
        max-width: 390px;
        text-align: left;
        position: relative;
      }
      .paint-modal h2 {
        margin: 4px 0 14px;
      }
      .paint-row {
        margin: 12px 0;
      }
      .paint-row > span {
        display: block;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #9fb6bd;
        margin-bottom: 7px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .swatch {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--c);
        border: 2px solid #0b1d25;
        box-shadow: 0 0 0 1px #f6f0e344;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .swatch:hover {
        transform: scale(1.12);
      }
      .swatch.on {
        box-shadow: 0 0 0 3px #f7c35c;
        transform: scale(1.1);
      }
      .finish-choices {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .finish {
        padding: 7px 11px;
        border-radius: 14px;
        border: 1px solid #f6f0e344;
        background: #0b1d25;
        color: #d9e4e6;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        cursor: pointer;
      }
      .finish.on {
        background: #f7c35c;
        color: #102b35;
        border-color: #f7c35c;
      }
      .paint-note {
        font-size: 11px;
        color: #9fb6bd;
        margin: 14px 0;
      }
      .map-random {
        display: flex;
        align-items: center;
        justify-content: center;
        background: repeating-linear-gradient(45deg, #f7c35c22 0 10px, #f7c35c11 10px 20px);
      }
      .random-mark {
        font-size: 44px;
        font-weight: 1000;
        font-style: italic;
        color: #f7c35c;
        text-shadow: 0 3px 0 #6b4a00;
        line-height: 1;
      }
      .lobby-track .random-mark {
        display: inline-block;
        width: 80px;
        text-align: center;
      }
      .random-card:hover .random-mark {
        transform: rotate(-12deg) scale(1.1);
        transition: transform 0.2s;
      }
      .compact-modal .setting-line {
        margin: 12px 0;
      }
      .compact-modal .setting-line select {
        max-width: 60%;
      }
      /* Colorblind mode: the Red team reads as amber everywhere in the HUD. */
      body.cvd .binding.team-red,
      body.cvd .player-hud.team-red .position-box small,
      body.cvd .team-red-text,
      body.cvd .lobby-team.team-red .lobby-team-name,
      body.cvd .lobby-seat.team-red.occupied,
      body.cvd .award-card.team-red > .icon,
      body.cvd .team-red .mate-arrow {
        color: #ffb000;
      }
      body.cvd .player-hud.team-red .position-box {
        box-shadow: inset 3px 0 0 #ffb000;
      }
      body.cvd .player-hud.team-blue .position-box {
        box-shadow: inset 3px 0 0 #3b8cff;
      }
      body.cvd .red-total {
        color: #ffb000;
      }
      body.cvd .red-total::before {
        content: "■ ";
      }
      body.cvd .blue-total::before {
        content: "▲ ";
      }
      .rematch-hint {
        margin: 6px 0 0;
        text-align: center;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: #9fb6bd;
      }
      .race-tip {
        position: absolute;

        }
        .pm-foot span:nth-of-type(n + 3),
        .pm-foot i:nth-of-type(n + 2) {
          display: none;
        }
      }
      @container ui (max-width:860px) {
        .menu.pm {
          display: block;
          overflow-y: auto;
          overflow-x: hidden;
          padding: 0 16px 16px;
        }
        .pm-top {
          gap: 10px;
        }
        .pm-brand {
          letter-spacing: 0.2em;
          font-size: 12px;
        }
        .pm-grid {
          display: flex;
          flex-direction: column;
          gap: 16px;
          flex: none;
          min-height: auto;
        }
        .pm-left > *,
        .pm-right > * {
          flex-shrink: 0;
        }
        .pm-left,
        .pm-right {
          overflow: visible;
        }
        .pm-center {
          min-height: 280px;
        }
        .pm-shade {
          position: fixed;
          background: linear-gradient(#050f16cc, #050f16a0 40%, #050f16ee);
        }
        .pm-foot {
          flex-wrap: wrap;
          height: auto;
          padding: 10px 0;
        }
        .pm-start {
          margin-top: 6px;
        }
      }
      /* ---------- Opening reel (over the live 3D race) ---------- */
      .intro-reel {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: transparent;
        overflow: hidden;
        color: #fff;
        cursor: pointer;
        transition: opacity 0.8s ease;
      }
      .intro-reel.out {
        opacity: 0;
        pointer-events: none;
      }
      .ir-black {
        position: absolute;
        inset: 0;
        background: #03080c;
        animation: irBlack 1.1s 0.15s ease both;
      }
      @keyframes irBlack {
        to {
          opacity: 0;
        }
      }
      .ir-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 75% at 50% 50%, transparent 45%, #03080ccc 100%);
        pointer-events: none;
      }
      .ir-bars i {
        position: absolute;
        left: 0;
        right: 0;
        height: 10.5cqh;
        background: #03080c;
        animation: irBars 7.2s ease both;
      }
      .ir-bars i:first-child {
        top: 0;
      }
      .ir-bars i:last-child {
        bottom: 0;
      }
      @keyframes irBars {
        0%,
        62% {
          transform: scaleY(1);
        }
        78%,
        100% {
          transform: scaleY(0.35);
        }
      }
      .ir-bars i:first-child {
        transform-origin: top;
      }
      .ir-bars i:last-child {
        transform-origin: bottom;
      }
      /* Film-style credit, lower left: "@name PRESENTS" */
      .ir-credit {
        position: absolute;
        left: 7cqw;
        bottom: 17cqh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        animation: irCredit 2.6s 0.35s ease both;
      }
      .ir-at {
        font-size: clamp(30px, 4.6cqw, 64px);
        font-weight: 900;
        letter-spacing: 0.1em;
        background: linear-gradient(100deg, #9fefff, #ffffff 45%, #f7c35c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px #3fd8ff77) drop-shadow(0 3px 0 #03080c);
        animation: irTrack 2.6s 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ir-line {
        width: 0;
        height: 2px;
        margin: 12px 0 10px;
        background: linear-gradient(90deg, #f7c35c, transparent);
        animation: irLine 2.6s 0.35s ease both;
      }
      .ir-presents {
        font-size: 13px;
        letter-spacing: 0.7em;
        font-weight: 800;
        color: #d9e4e6;
        text-shadow: 0 2px 8px #000a;
        animation: irFade 2.6s 0.35s ease both;
      }
      @keyframes irCredit {
        0% {
          opacity: 0;
          transform: translateX(-18px);
        }
        14% {
          opacity: 1;
          transform: none;
        }
        84% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(12px);
        }
      }
      @keyframes irTrack {
        0% {
          letter-spacing: 0.5em;
          filter: blur(8px);
        }
        35%,
        100% {
          filter: drop-shadow(0 0 18px #3fd8ff77) drop-shadow(0 3px 0 #03080c);
        }
        100% {
          letter-spacing: 0.1em;
        }
      }
      @keyframes irLine {
        0%,
        15% {
          width: 0;
        }
        55%,
        100% {
          width: min(360px, 50cqw);
        }
      }
      @keyframes irFade {
        0%,
        30% {
          opacity: 0;
          transform: translateY(6px);
        }
        50%,
        100% {
          opacity: 1;
          transform: none;
        }
      }
      /* Feature line during the tracking shot */
      .ir-features {
        position: absolute;
        left: 50%;
        bottom: 15cqh;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 18px;
        white-space: nowrap;
        opacity: 0;
        animation: irFeat 1.8s 2.9s ease both;
      }
      .ir-features b {
        font-size: clamp(13px, 1.5cqw, 20px);
        letter-spacing: 0.32em;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 10px #000c;
      }
      .ir-features i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f7c35c;
        box-shadow: 0 0 10px #f7c35c;
      }
      @keyframes irFeat {
        0% {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        18%,
        80% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
        }
      }
      /* Title slam as the camera cranes up */
      .ir-title {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        animation: irTitle 2.6s 4.75s cubic-bezier(0.2, 0.9, 0.25, 1) both;
      }
      .ir-kicker {
        font-size: 12px;
        letter-spacing: 0.5em;
        padding-left: 0.5em;
        color: #3fd8ff;
        font-weight: 800;
        margin-bottom: 12px;
        text-shadow: 0 2px 8px #000a;
      }
      .ir-title h1 {
        margin: 0;
        display: flex;
        flex-direction: column;
        line-height: 0.84;
        font-size: clamp(70px, 11cqw, 170px);
        font-weight: 1000;
        letter-spacing: -0.04em;
      }
      .ir-toy {
        background: linear-gradient(180deg, #fffaf0 30%, #c9bfae);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 0 #0b1d25) drop-shadow(0 12px 30px #000a);
      }
      .ir-rally {
        font-style: italic;
        background: linear-gradient(100deg, #ffd76a, #f7a23c 45%, #ff6a3d 70%, #ffd76a);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 0 #4a2208) drop-shadow(0 12px 30px #000a);
        animation:
          irRally 0.7s 5s cubic-bezier(0.2, 1.4, 0.4, 1) both,
          pmShine 3s 5.2s linear infinite;
        padding-right: 0.08em;
      }
      .ir-tag {
        margin-top: 20px;
        font-size: 14px;
        letter-spacing: 0.5em;
        padding-left: 0.5em;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 10px #000c;
        animation: irFade2 0.8s 5.6s ease both;
      }
      @keyframes irTitle {
        0% {
          opacity: 0;
          transform: scale(1.5);
          filter: blur(14px);
        }
        18%,
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0);
        }
      }
      @keyframes irRally {
        from {
          transform: translateX(40%) skewX(-18deg);
          opacity: 0;
        }
      }
      @keyframes irFade2 {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .ir-flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        animation: irFlash 0.6s 4.77s ease-out both;
      }
      @keyframes irFlash {
        0% {
          opacity: 0;
        }
        15% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
        }
      }
      .ir-skip {
        position: absolute;
        bottom: 3.5cqh;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.3em;
        color: #ffffff66;
        font-weight: 800;
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        .ir-bars i {
          animation: none;
        }
      }
      /* Room for the Remix host bar that slides down over the top edge in fullscreen. */
      :root {
        --host-top: 34px;
      }
      .pm-top {
        height: calc(64px + var(--host-top));
        padding-top: var(--host-top);
      }
      .hud-layer .race-topbar {
        height: calc(57px + var(--host-top));
        padding-top: calc(8px + var(--host-top));
      }
      .hud-layer .position-box,
      .hud-layer .mate-box,
      .hud-layer .minimap,
      .race-tip,
      .ghost-box,
      .podium-caption {
        margin-top: var(--host-top);
      }
      /* Centred menu: on wide screens the three columns gather into a centred block instead of hugging the edges. */
      .menu.pm {
        padding-left: max(2.4%, calc((100% - 1520px) / 2));
        padding-right: max(2.4%, calc((100% - 1520px) / 2));
      }
      .menu.pm .pm-grid {
        grid-template-columns: minmax(300px, 380px) 1fr minmax(320px, 400px);
        justify-content: center;
      }
      @container ui (max-height:700px) and (min-width:861px) {
        .pm-top {
          height: calc(54px + var(--host-top));
        }
      }
    </style>

    <style id="touch-controls">
      /* On-screen controls, shown only while playing by touch. Sizes are in UI units (phones scale the UI to fit). */
      .touch-pad {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      body.touch .touch-pad {
        display: block;
      }
      body.touch [data-touch] {
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .touch-pad button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border-radius: 26px;
        border: 2px solid #ffffff3a;
        background: #0b2230b3;
        color: #fff;
        font-weight: 900;
        letter-spacing: 0.12em;
        box-shadow: 0 10px 30px #00121c66;
        transition:
          transform 0.06s,
          background 0.06s;
      }
      .touch-pad button.held {
        transform: scale(0.94);
        background: #1f5d6ee6;
        border-color: #7fe9f2;
      }
      .touch-pad .icon {
        width: 52px;
        height: 52px;
        stroke-width: 2.6;
      }
      .tp-steer {
        position: absolute;
        left: 28px;
        bottom: 28px;
        display: flex;
        gap: 18px;
      }
      .tp-steer button {
        width: 138px;
        height: 138px;
      }
      .tp-act {
        position: absolute;
        right: 28px;
        bottom: 28px;
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }
      .tp-brake {
        width: 112px;
        height: 112px;
        font-size: 15px;
      }
      .tp-drift {
        width: 150px;
        height: 150px;
        font-size: 19px;
        background: #5a3b10b3 !important;
        border-color: #ffc35a88 !important;
      }
      .tp-drift.held {
        background: #a8701ae6 !important;
        border-color: #ffd88a !important;
      }
      .tp-mini {
        position: absolute;
        left: 28px;
        top: calc(var(--host-top) + 150px);
        display: flex;
        gap: 12px;
      }
      .tp-mini button {
        width: 86px;
        height: 76px;
        border-radius: 20px;
      }
      .tp-mini .icon {
        width: 28px;
        height: 28px;
      }
      .tp-mini small {
        font-size: 9px;
        letter-spacing: 0.12em;
      }
      /* Move the race HUD around the thumbs: powers bottom centre (tap to use), body bar and speed above the buttons. */
      body.touch .player-hud .power-slots {
        left: 50% !important;
        right: auto !important;
        bottom: 26px !important;
        transform: translateX(-50%);
        gap: 12px !important;
      }
      body.touch .player-hud .power-slot {
        width: 96px !important;
        height: 100px !important;
      }
      body.touch .power-slot.held {
        transform: scale(0.94);
      }
      body.touch .player-hud .car-condition {
        left: 28px !important;
        bottom: 186px !important;
      }
      body.touch .player-hud .speed-box {
        right: 28px !important;
        bottom: 196px !important;
      }
      body.touch .race-control-hint,
      body.touch .power-slot .slot-key {
        display: none !important;
      }
      @container ui (max-width:1000px) {
        .tp-steer button {
          width: 118px;
          height: 118px;
        }
        .tp-steer {
          gap: 14px;
        }
        .tp-brake {
          width: 98px;
          height: 98px;
        }
        .tp-drift {
          width: 132px;
          height: 132px;
        }
        body.touch .player-hud .power-slot {
          width: 82px !important;
          height: 88px !important;
        }
        body.touch .player-hud .power-slots {
          gap: 8px !important;
        }
      }
      /* Phones: no keyboard-only extras in menus. */
      body.phone .kb-help,
      body.phone .rematch-hint {
        display: none;
      }
      body.phone #ui {
        touch-action: manipulation;
      }
      /* Phone menu: tracks in two columns, the right column scrolls if a short screen still needs it. */
      body.phone .menu.pm .pm-grid {
        grid-template-columns: minmax(250px, 31%) 1fr minmax(330px, 40%);
        min-height: 0;
      }
      body.phone .pm-right {
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
        max-height: 100%;
        scrollbar-width: none;
        padding-bottom: 6px;
      }
      body.phone .pm-tracks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      body.phone .pm-track {
        padding: 4px 6px 4px 4px;
        min-width: 0;
      }
      body.phone .pm-track-art {
        height: 30px;
        width: 42px;
        flex: none;
      }
      body.phone .pm-track-text {
        min-width: 0;
      }
      .phone .pm-track-text b {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      body.phone .pm-track-num {
        display: none;
      }
      body.phone .pm-foot > span,
      body.phone .pm-foot > i {
        display: none;
      }
      body.phone .pm-arrow {
        width: 44px;
        height: 44px;
        font-size: 22px;
      }
      /* Phone settings: the whole row is the tap target; each tap steps to the next value. */
      body.phone #ui select {
        pointer-events: none;
      }
      body.phone #ui label.rule,
      body.phone #ui label.setting-line,
      body.phone #ui label.binding {
        pointer-events: auto;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      body.phone #ui label.rule:active,
      body.phone #ui label.setting-line:active {
        filter: brightness(1.3);
      }
      /* Phone menu: slimmer header, no footer row, header steps around the host's corner buttons. */
      body.phone .menu.pm .pm-top {
        height: 52px;
        padding-top: 0;
        padding-left: var(--host-pad-left, 0px);
        padding-right: var(--host-pad-right, 0px);
      }
      body.phone .menu.pm .pm-foot {
        display: none;
      }
      body.phone .menu.pm .pm-grid {
        padding: 0 0 24px;
      }
      body.phone .pm-logo h1 {
        font-size: 54px;
        margin: 2px 0 4px;
      }
      /* Phone race HUD: corner readouts step around the host buttons too. */
      body.phone .hud-layer .race-topbar {
        padding-left: calc(20px + var(--host-pad-left, 0px));
        padding-right: calc(20px + var(--host-pad-right, 0px));
      }
      body.phone .player-hud .position-box,
      body.phone .tp-mini {
        margin-left: var(--host-pad-left, 0px);
      }
      body.phone .hud-layer .minimap {
        margin-right: var(--host-pad-right, 0px);
      }
      /* Portrait phones: ask for landscape. */
      .rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #0b2230;
        color: var(--cream);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 30px;
        font-weight: 800;
        letter-spacing: 0.12em;
        font-size: 14px;
      }
      .rotate-hint svg {
        width: 72px;
        height: 72px;
        color: #ffc35a;
        animation: rotHint 2.2s ease-in-out infinite;
      }
      .rotate-hint small {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #a1b5bb;
        font-weight: 600;
      }
      body.portrait .rotate-hint {
        display: flex;
      }
      @keyframes rotHint {
        0%,
        25% {
          transform: rotate(0);
        }
        55%,
        100% {
          transform: rotate(-90deg);
        }
      }
    </style>
    
  </head>
  <body>
    <canvas id="game" aria-label="Toybox Rally 3D game"></canvas>
    <div id="ui">
      <div class="boot"><span>TOYS ARE HITTING THE TRACK…</span></div>
    </div>
    <div class="rotate-hint" role="alert">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="7" y="2" width="10" height="20" rx="2" />
        <path d="M11 18h2" /></svg
      ><span>TURN YOUR PHONE SIDEWAYS</span><small>Toybox Rally plays in landscape</small>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
