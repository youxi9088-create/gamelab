<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" href="data:,"><meta charset="UTF-8" />
        <!-- width=device-width — иначе мобильный браузер вёрстает страницу под ~980px и масштабирует вниз.
             user-scalable=no / maximum-scale=1 — запрет pinch-zoom (iOS Safari их игнорирует, там зум добивается через touch-action: none).
             viewport-fit=cover — канвас уходит под "чёлку" на iPhone. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>Rail in the Air</title>
        <script>
            // Prevent scroll (source: poki sdk)
            window.addEventListener('keydown', (ev) => {
                if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
                    ev.preventDefault();
                }
            });
            // Prevent context menu (right click)
            document.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });
        </script>

        <style>
            body {
                margin: 0;
                /* Убираем скролл */
                overflow: hidden;

                /* Убираем лонгтап на IOS */
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            }

            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
            }

            #loading-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: black;
                color: white;
                font-size: 2rem;
                z-index: 1000;
            }

            #loading-icon {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }
        </style>

        
        

      <script type="module" crossorigin src="./assets/index-V3F3wFyT.js"></script>
    </head>
    <body>
        <div id="loading-screen">
            <img src="./assets/icon-CRPZlS46.png" alt="Loading Icon" id="loading-icon" />
            <span>Loading...</span>
        </div>
        <canvas id="application-canvas"></canvas>

        <script>
            document.addEventListener('gameLoaded', () => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.display = 'none';
                }
            });
        </script>
    </body>
</html>
