<!DOCTYPE html>

<html>
<head>
<title>Narwhal.io</title>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>



<style>* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --hud-bg: rgba(6, 28, 33, 0.91);
    --hud-bg-strong: rgba(5, 25, 31, 0.96);
    --hud-line: rgba(92, 184, 174, 0.28);
    --hud-text: #f6fbff;
    --hud-muted: rgba(232, 244, 248, 0.70);
    --boost-blue: #09bde8;
    --boost-blue-light: #38d4f4;
    --boost-dark: #06354f;
    --player-green: #09d77a;
    --gold: #f0ca56;
    --danger: #ee704f;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #0a3550;
    font-family: 'Inter', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    /* Support for iPhone notch / Dynamic Island / home indicator */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

#game-world {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10486e;
}

#game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 9 / 16;
    margin: auto;
    position: absolute;
    inset: 0;
    object-fit: contain;
    touch-action: none;
}

/* Leaderboard */
#leaderboard {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 30;
    width: 174px;
    /* Height is content-based: no fixed height/min-height */
    padding: 7px 10px 8px;
    border-radius: 13px;
    background: rgba(4, 18, 26, 0.92);
    border: 1.5px solid rgba(92, 184, 174, 0.32);
    box-shadow: 0 4px 18px rgba(0,0,0,0.48), inset 0 1px 0 rgba(255,255,255,0.04);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 0;
}

#leaderboard-title {
    color: rgba(138, 245, 244, 0.85);
    font: 900 11px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 4px;
    border-top: 1px solid rgba(92, 184, 174, 0.22);
    padding-top: 3px;
}

#leaderboard-entries {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.leaderboard-entry {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto;
    align-items: center;
    gap: 4px;
    height: 26px;
    padding: 0 4px;
    border-radius: 6px;
    overflow: hidden;
}

.leaderboard-divider {
    width: 85%;
    height: 1px;
    margin: 3px auto;
    background: rgba(180, 220, 240, 0.18);
    flex-shrink: 0;
}

/* Medal background tints for top 3 */
.leaderboard-entry:first-child {
    background: rgba(240, 202, 86, 0.10);
}
.leaderboard-entry:nth-child(2) {
    background: rgba(200, 216, 224, 0.07);
}
.leaderboard-entry:nth-child(3) {
    background: rgba(212, 138, 96, 0.08);
}

.leaderboard-entry.player {
    background: rgba(9, 215, 122, 0.18);
    border: 1px solid rgba(9, 215, 122, 0.25);
}

.leaderboard-rank {
    color: rgba(180, 210, 220, 0.70);
    text-align: center;
    font: 700 11px 'Inter', sans-serif;
    line-height: 1;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    flex-shrink: 0;
    width: 18px;
}

/* Medal emoji for top 3 rows — hide numeric rank text, show emoji via ::before */
.leaderboard-entry:first-child .leaderboard-rank,
.leaderboard-entry:nth-child(2) .leaderboard-rank,
.leaderboard-entry:nth-child(3) .leaderboard-rank {
    font-size: 0; /* hide number */
    line-height: 26px;
}
.leaderboard-entry:first-child .leaderboard-rank::before  { content: '🥇'; font-size: 13px; }
.leaderboard-entry:nth-child(2) .leaderboard-rank::before { content: '🥈'; font-size: 13px; }
.leaderboard-entry:nth-child(3) .leaderboard-rank::before { content: '🥉'; font-size: 13px; }

/* Pinned player row: rank is a plain number, no medal */
.leaderboard-entry.pinned .leaderboard-rank {
    font-size: 11px !important;
    color: #09d77a;
    line-height: 1;
}
.leaderboard-entry.pinned .leaderboard-rank::before { content: none !important; }

.leaderboard-entry.player .leaderboard-rank {
    color: #09d77a;
    font-size: 11px !important;
    line-height: 1;
}
.leaderboard-entry.player .leaderboard-rank::before { content: none !important; }

.leaderboard-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #ffffff;
    font: 700 13px 'Inter', sans-serif;
    line-height: 1;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}

.leaderboard-entry.player .leaderboard-name {
    color: #09e87e;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(9, 232, 126, 0.50), 0 1px 4px rgba(0,0,0,0.9);
}

.leaderboard-mass {
    color: rgba(220, 240, 248, 0.90);
    text-align: right;
    font: 700 12px 'Orbitron', sans-serif;
    line-height: 1;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    white-space: nowrap;
    letter-spacing: 0.2px;
}

.leaderboard-entry:first-child .leaderboard-mass  { color: #f5d972; }
.leaderboard-entry:nth-child(2) .leaderboard-mass { color: #cde4ec; }
.leaderboard-entry:nth-child(3) .leaderboard-mass { color: #e0a870; }

.leaderboard-entry.player .leaderboard-mass {
    color: #09e87e;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(9, 232, 126, 0.50), 0 1px 4px rgba(0,0,0,0.9);
}

/* ===== SEA PROGRESS BUTTON (top-center, between minimap and leaderboard) ===== */
#sea-progress-button {
    position: absolute;
    top: 12px;
    left: 50%;
    z-index: 40;
    width: 296px;
    height: 52px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    transform: translateX(-50%);
    transition: filter 120ms ease;
}

#sea-progress-button:hover {
    transform: translateX(-50%) translateY(-1px);
}

#sea-progress-button:active {
    transform: translateX(-50%) translateY(1px) scale(0.99);
}

#sea-progress-button:focus-visible {
    outline: 3px solid rgba(56, 212, 244, 0.85);
    outline-offset: 2px;
    border-radius: 14px;
}

.sea-progress-track {
    position: absolute;
    left: 26px;
    right: 0;
    top: 5px;
    height: 42px;
    border-radius: 21px;
    background: rgba(4, 27, 41, 0.96);
    border: 2.5px solid rgba(56, 212, 244, 0.50);
    box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.55),
        0 2px 0 rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(180, 230, 255, 0.10);
    overflow: hidden;
}

#sea-progress-button:hover .sea-progress-track {
    border-color: rgba(56, 212, 244, 0.65);
}

#sea-progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    height: 100%;
    border-radius: inherit;
    transition: width 400ms ease;
}

/* Sea-specific fill gradients */
#sea-progress-button.sea-1 #sea-progress-fill {
    background: linear-gradient(90deg, #1ac8e0, #7ff0e0);
}
#sea-progress-button.sea-2 #sea-progress-fill {
    background: linear-gradient(90deg, #1aaa6e, #5ce8a8);
}
#sea-progress-button.sea-3 #sea-progress-fill {
    background: linear-gradient(90deg, #d4880a, #f0c040);
}
#sea-progress-button.sea-4 #sea-progress-fill {
    background: linear-gradient(90deg, #7a2ae0, #c080ff);
}
#sea-progress-button.complete #sea-progress-fill {
    background: linear-gradient(90deg, #c89a18, #ffd84a, #ffe88a);
}

/* Brief glow on progress increase — use box-shadow/filter, not transform */
#sea-progress-button.glow .sea-progress-track {
    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(180, 230, 255, 0.08),
        0 0 14px rgba(127, 240, 192, 0.55);
}

.sea-progress-medallion {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(22, 72, 90, 0.99) 0%, rgba(4, 27, 41, 0.99) 100%);
    border: 3px solid rgba(56, 212, 244, 0.80);
    box-shadow:
        0 6px 0 rgba(2, 14, 26, 0.90),
        0 8px 18px rgba(0, 0, 0, 0.60),
        0 0 16px rgba(56, 212, 244, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 80ms ease, box-shadow 80ms ease;
}

#sea-progress-button:hover .sea-progress-medallion {
    box-shadow:
        0 6px 0 rgba(2, 14, 26, 0.90),
        0 8px 18px rgba(0, 0, 0, 0.60),
        0 0 22px rgba(56, 212, 244, 0.50),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
}

#sea-progress-button:active .sea-progress-medallion {
    transform: translateY(4px);
    box-shadow:
        0 2px 0 rgba(2, 14, 26, 0.90),
        0 3px 8px rgba(0, 0, 0, 0.50),
        inset 0 2px 4px rgba(0, 0, 0, 0.30);
}

/* CSS compass needle */
.sea-progress-compass {
    position: relative;
    width: 22px;
    height: 22px;
}

.sea-progress-compass::before,
.sea-progress-compass::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
}

/* North needle (red/white) */
.sea-progress-compass::before {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 11px solid #ff5050;
    transform: translate(-50%, -100%);
}

/* South needle (dark) */
.sea-progress-compass::after {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 11px solid rgba(200, 230, 255, 0.55);
    transform: translate(-50%, 0%);
}

/* Complete state: crown/star instead of compass */
#sea-progress-button.complete .sea-progress-compass::before {
    border: none;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    background: none;
    background-color: #ffd84a;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

#sea-progress-button.complete .sea-progress-compass::after {
    display: none;
}

#sea-progress-button.complete .sea-progress-medallion {
    border-color: rgba(255, 216, 74, 0.90);
    box-shadow:
        0 6px 0 rgba(80, 50, 0, 0.80),
        0 8px 18px rgba(0, 0, 0, 0.60),
        0 0 22px rgba(255, 200, 40, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    background: linear-gradient(160deg, rgba(70, 50, 4, 0.99) 0%, rgba(30, 18, 2, 0.99) 100%);
}

#sea-progress-label {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffffff;
    font: 900 15px 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 110px;
    pointer-events: none;
    z-index: 1;
}

#sea-progress-percent {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.95);
    font: 900 16px 'Orbitron', sans-serif;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    pointer-events: none;
    z-index: 1;
}

.sea-progress-chevron {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.55);
    font: 900 18px 'Inter', sans-serif;
    line-height: 1;
    pointer-events: none;
    z-index: 1;
}

/* Score + boost bar at bottom center, Hornfish-style */
#bottom-status {
    position: absolute;
    left: 50%;
    bottom: 56px;
    z-index: 35;
    display: flex;
    width: auto;
    min-width: 200px;
    max-width: 320px;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transform: translateX(-50%);
    pointer-events: none;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.55));
}

#mass-pill {
    display: flex;
    min-width: 96px;
    max-width: 220px;
    height: 42px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 20px;
    border-radius: 21px;
    color: #fff;
    background: rgba(6, 46, 62, 0.95);
    border: 2px solid rgba(9, 215, 160, 0.55);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow: hidden;
}

#boost-icon {
    display: none;
}

#mass-value {
    color: #fff;
    font: 900 24px 'Orbitron', sans-serif;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(9,215,160,0.5);
    white-space: nowrap;
    transition: font-size 150ms ease;
}

#boost-track {
    position: relative;
    width: 260px;
    height: 36px;
    margin-top: 10px;
    border-radius: 18px;
    background: rgba(8, 30, 52, 0.97);
    border: 3px solid rgba(56, 212, 244, 0.65);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 2px 6px rgba(0,0,0,0.4), 0 0 20px rgba(56,212,244,0.28);
    overflow: visible;
    display: flex;
    align-items: center;
}

#boost-bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 20px;
    line-height: 1;
    z-index: 3;
    pointer-events: none;
    text-shadow:
        0 0 1px rgba(0,0,0,1),
        0 1px 3px rgba(0,0,0,0.95),
        0 2px 6px rgba(0,0,0,0.80),
        0 0 14px rgba(56,212,244,0.55);
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.8));
}

#boost-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 100%;
    overflow: hidden;
    border-radius: inherit;
    background: linear-gradient(90deg, #1a9fe8, #38d4f4 60%, #80eeff);
    box-shadow: 0 0 10px rgba(56,212,244,0.50) inset;
    transition: width 45ms linear;
}

#boost-fill.locked {
    background: linear-gradient(90deg, #a84438, #e86f52);
    box-shadow: 0 0 8px rgba(232, 111, 82, 0.5);
}

#boost-fill.drain-flash {
    animation: boost-drain-blink 0.32s ease-out;
}

@keyframes boost-drain-blink {
    0%   { filter: brightness(2.8) saturate(0.5); }
    35%  { filter: brightness(0.4) saturate(1.6); }
    100% { filter: brightness(1) saturate(1); }
}

/* Regen hint: subtle shimmer sweep on the fill + soft border pulse on the track */
#boost-fill.regen-hint::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.28) 48%,
        rgba(255, 255, 255, 0.10) 52%,
        transparent 72%
    );
    background-size: 200% 100%;
    animation: boost-shimmer 2.2s ease-in-out infinite;
    border-radius: inherit;
    pointer-events: none;
}

#boost-track.regen-hint {
    animation: boost-track-breathe 2.2s ease-in-out infinite;
}

@keyframes boost-shimmer {
    0%   { background-position: 200% 0; opacity: 0; }
    18%  { opacity: 1; }
    60%  { background-position: -30% 0; opacity: 1; }
    80%  { opacity: 0; }
    100% { background-position: -30% 0; opacity: 0; }
}

@keyframes boost-track-breathe {
    0%, 100% { box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 2px 6px rgba(0,0,0,0.4), 0 0 20px rgba(56,212,244,0.28); }
    42%       { box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 2px 6px rgba(0,0,0,0.4), 0 0 32px rgba(56,212,244,0.55), 0 0 8px rgba(56,212,244,0.22) inset; }
}



/* Explicit mobile boost control — Hornfish-style */
#boost-button {
    position: absolute;
    right: 30px;
    bottom: 104px;
    z-index: 60;
    display: none;
    width: 160px;
    height: 160px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 3px solid rgba(211, 248, 255, 0.76);
    border-radius: 50%;
    color: #eafdff;
    background: radial-gradient(circle at 35% 28%, rgba(56,212,244,0.72), rgba(10,174,216,0.65) 54%, rgba(8,101,139,0.60) 100%);
    box-shadow: 0 7px 0 #063d58, 0 11px 25px rgba(0, 0, 0, 0.28);
    font-family: 'Orbitron', sans-serif;
    touch-action: none;
}

.boost-button-icon {
    font-size: 68px;
    line-height: 1;
}

.boost-button-text {
    display: none;
}

#boost-button.active {
    transform: translateY(5px) scale(0.98);
    box-shadow: 0 2px 0 #063d58, 0 6px 15px rgba(0, 0, 0, 0.22);
}

#boost-button.depleted {
    filter: saturate(0.42) brightness(0.76);
}

.touch-mode #boost-button {
    display: flex;
    width: 160px;
    height: 160px;
    right: calc(30px + env(safe-area-inset-right, 0px));
    bottom: calc(104px + env(safe-area-inset-bottom, 0px));
}

.touch-mode #sound-toggle {
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: calc(30px + env(safe-area-inset-right, 0px));
    width: 80px;
    height: 52px;
    font-size: 26px;
}



.touch-mode #bottom-status {
    left: 50%;
    bottom: calc(46px + env(safe-area-inset-bottom, 0px));
    width: auto;
    min-width: 180px;
    max-width: 280px;
}

.touch-mode #boost-track {
    width: 230px;
    height: 38px;
}

.touch-mode #mass-pill {
    min-width: 86px;
    height: 38px;
    padding: 0 16px;
}

.touch-mode #mass-value {
    font-size: 20px;
}

#evolution-banner {
    position: absolute;
    top: 32%;
    left: 50%;
    z-index: 70;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0;
    background: none;
    border: none;
    box-shadow: none;
    transform: translate(-50%, -50%) scale(0.72);
    opacity: 0;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.15s ease;
}

#evolution-banner::before {
    content: '';
    display: block;
}

#evolution-banner.show {
    animation: evolution-pop 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

#evolution-tier {
    color: #FFE052;
    font: 900 56px 'Orbitron', sans-serif;
    letter-spacing: 4px;
    line-height: 1;
    -webkit-text-stroke: 2.5px rgba(0, 0, 0, 0.85);
    paint-order: stroke fill;
    text-shadow:
        0 0 0 rgba(0,0,0,0),
        0 4px 0 rgba(0, 0, 0, 0.9),
        0 0 28px rgba(255, 220, 50, 0.85),
        0 0 64px rgba(255, 200, 20, 0.55);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
}

#evolution-name {
    margin-top: 6px;
    color: #ffffff;
    font: 800 22px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.80);
    paint-order: stroke fill;
    text-shadow:
        0 2px 0 rgba(0, 0, 0, 0.9),
        0 0 18px rgba(200, 240, 255, 0.65),
        0 0 40px rgba(150, 220, 255, 0.35);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.65));
}

@keyframes evolution-pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(0.96); }
    45%  { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
    80%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    100% { opacity: 0; transform: translate(-50%, -64%) scale(0.94); }
}

/* Controls hint overlay */
#controls-hint {
    position: absolute;
    left: 50%;
    bottom: 220px;
    z-index: 50;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 40px;
    border-radius: 22px;
    background: rgba(4, 20, 34, 0.93);
    border: 2px solid rgba(92, 190, 235, 0.50);
    box-shadow: 0 6px 28px rgba(0,0,0,0.60), 0 0 0 1px rgba(92,190,235,0.12) inset;
    pointer-events: none;
    opacity: 0;
    transition: opacity 250ms ease;
    white-space: nowrap;
}

#controls-hint.visible {
    opacity: 1;
}

.hint-line {
    color: rgba(230, 246, 255, 0.97);
    font: 700 21px 'Inter', sans-serif;
    letter-spacing: 0.4px;
    line-height: 1.65;
    text-align: center;
}

/* Hide old sub-elements */
.hint-title { display: none; }
.hint-icon  { display: none; }
.hint-controls { display: none; }

.touch-mode #controls-hint {
    bottom: 340px;
    align-items: center;
    padding: 32px 44px;
    gap: 14px;

/* ===== ALPHA HUNT HUD — centered below Atlas button ===== */
#alpha-hunt-status {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 39;
    width: 270px;
    height: 40px;
    padding: 0;
    border: none;
    background: none;
    pointer-events: none;
    display: none;
    align-items: center;
}

#alpha-hunt-status.visible {
    display: flex;
}

.alpha-hunt-track {
    position: absolute;
    left: 20px;
    right: 0;
    top: 4px;
    height: 32px;
    border-radius: 16px;
    background: rgba(4, 27, 41, 0.96);
    border: 2px solid rgba(255, 200, 60, 0.50);
    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(255, 230, 150, 0.08);
    overflow: hidden;
}

#alpha-hunt-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    height: 100%;
    border-radius: inherit;
    transition: width 200ms linear;
}

/* Charging state: gold fill */
#alpha-hunt-status.charging #alpha-hunt-fill {
    background: linear-gradient(90deg, #c89a18, #ffd84a, #ffe88a);
}

/* Active state: red/orange fill */
#alpha-hunt-status.active-hunt #alpha-hunt-fill {
    background: linear-gradient(90deg, #cc3300, #ff6633, #ff9944);
}

/* Final 5s red pulse — moderate, not distracting */
#alpha-hunt-status.hunt-urgent .alpha-hunt-track {
    animation: alpha-urgent-pulse 0.8s ease-in-out infinite;
}

@keyframes alpha-urgent-pulse {
    0%, 100% { border-color: rgba(255, 80, 40, 0.55); box-shadow: 0 3px 10px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,230,150,0.08); }
    50% { border-color: rgba(255, 60, 30, 0.90); box-shadow: 0 3px 10px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,230,150,0.08), 0 0 12px rgba(255, 60, 30, 0.35); }
}

.alpha-hunt-medallion {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(4, 27, 41, 0.98);
    border: 2.5px solid rgba(255, 200, 60, 0.70);
    box-shadow:
        0 0 10px rgba(255, 200, 60, 0.25),
        0 2px 6px rgba(0, 0, 0, 0.50);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* CSS crown icon */
.alpha-hunt-crown-icon {
    position: relative;
    width: 18px;
    height: 14px;
}

.alpha-hunt-crown-icon::before {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 18px;
    height: 10px;
    background: #ffd84a;
    border-radius: 2px 2px 3px 3px;
}

.alpha-hunt-crown-icon::after {
    content: '';
    position: absolute;
    left: 1px;
    top: 0;
    width: 16px;
    height: 8px;
    background: none;
    border-left: 3px solid #ffd84a;
    border-right: 3px solid #ffd84a;
    clip-path: polygon(0% 100%, 0% 0%, 25% 60%, 50% 0%, 75% 60%, 100% 0%, 100% 100%);
    background: #ffd84a;
}

#alpha-hunt-label {
    position: absolute;
    left: 50px;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffffff;
    font: 900 12px 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    z-index: 1;
}

#alpha-hunt-status.hunt-start .alpha-hunt-track {
    box-shadow:
        0 3px 10px rgba(0,0,0,0.50),
        inset 0 1px 0 rgba(255,230,150,0.08),
        0 0 18px rgba(255, 216, 74, 0.55);
}

/* Alpha Hunt bonus badge below the status */
#alpha-hunt-bonus {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    margin-top: 6px;
    color: #ffd84a;
    font: 900 18px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    text-shadow: 0 0 14px rgba(255, 216, 74, 0.8), 0 2px 4px rgba(0,0,0,0.9);
    -webkit-text-stroke: 0.5px rgba(0,0,0,0.5);
    paint-order: stroke fill;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;

}

#alpha-hunt-bonus.show {

}

/* Celebrate blink */
#alpha-hunt-status.hunt-celebrate .alpha-hunt-medallion {
    animation: alpha-medallion-blink 0.35s ease-in-out 6;
}

@keyframes alpha-medallion-blink {
    0%, 100% { border-color: rgba(255, 200, 60, 0.70); }
    50% { border-color: rgba(255, 255, 200, 1); box-shadow: 0 0 16px rgba(255, 216, 74, 0.80), 0 2px 6px rgba(0,0,0,0.50); }
}

/* Alpha Hunt center announcement */
#alpha-hunt-announce {
    position: absolute;
    top: 38%;
    left: 50%;
    z-index: 75;
    transform: translate(-50%, -50%) scale(0.7);

    flex-direction: column;
    align-items: center;
    gap: 10px;

    pointer-events: none;

}

#alpha-hunt-announce.show {

}

#alpha-announce-title {
    color: #ffd84a;

    font-weight: 900;
    font-size: clamp(22px, 6vw, 42px);

    text-align: center;
    white-space: normal;

    padding: 0 12px;
    -webkit-text-stroke: 2px rgba(0,0,0,0.9);
    paint-order: stroke fill;
    text-shadow: 0 0 36px rgba(255, 216, 74, 0.85), 0 5px 0 rgba(0,0,0,0.9), 0 0 80px rgba(255,200,40,0.4);
}

#alpha-announce-sub {
    color: #ffffff;
    font: 800 20px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    text-align: center;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.7);
    paint-order: stroke fill;

#alpha-announce-sub:empty { display: none; }

@keyframes alpha-announce-pop {

    8%   { opacity: 1; transform: translate(-50%, -50%) scale(1.10); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(0.97); }

/* Alpha Hunt result flash */
#alpha-hunt-result {

@keyframes alpha-result-complete-pop {

    75%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
    100% { opacity: 0; transform: translate(-50%, -56%) scale(0.94); }
}

@keyframes alpha-result-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    10% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    20% { transform: translate(-50%, -50%) scale(0.98); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }

#alpha-hunt-result .result-title {

#alpha-hunt-result.complete .result-title {

#alpha-hunt-result.failed .result-title {

#alpha-hunt-result .result-bonus {

/* Alpha Hunt bonus badge below the status */
#alpha-hunt-bonus {

    left: 50%;
    transform: translateX(-50%) scale(0.8);

    color: #ffd84a;
    font: 900 18px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    text-shadow: 0 0 14px rgba(255, 216, 74, 0.8), 0 2px 4px rgba(0,0,0,0.9);
    -webkit-text-stroke: 0.5px rgba(0,0,0,0.5);
    paint-order: stroke fill;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;

}

#alpha-hunt-bonus.show {

}

@keyframes bonus-pop-in {

    40%  { transform: translateX(-50%) scale(1.15); opacity: 1; }

}



/* Score pop animation */
#mass-pill.score-pop {
    animation: score-pop-anim 0.35s ease-out;
}

@keyframes score-pop-anim {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
}

/* Joystick — Hornfish-style fixed position */
#joystick-container {
    position: absolute;
    z-index: 55;
    pointer-events: none;
}

#joystick-container.hidden {
    display: none;
}

/* On touch-mode, joystick is always visible at fixed bottom-left */
.touch-mode #joystick-container {
    display: block !important;
    left: calc(30px + env(safe-area-inset-left, 0px)) !important;
    bottom: calc(104px + env(safe-area-inset-bottom, 0px)) !important;
    top: auto !important;
    width: 192px;
    height: 192px;
}

#joystick-base,
#joystick-knob {
    position: absolute;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

#joystick-base {
    width: 192px;
    height: 192px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: none;
}

/* Directional arrows at cardinal points */
#joystick-base::before {
    content: '▲';
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.50);
    font-size: 13px;
    line-height: 1;
    border-radius: 0;
    background: none;
    pointer-events: none;
}

#joystick-base::after {
    content: '▼';
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.50);
    font-size: 13px;
    line-height: 1;
    pointer-events: none;
}

.joy-arrow {
    position: absolute;
    top: 50%;
    color: rgba(255, 255, 255, 0.50);
    font-size: 13px;
    line-height: 1;
    pointer-events: none;
}

.joy-left  { left: 7px; transform: translateY(-50%) rotate(-90deg); }
.joy-right { right: 7px; transform: translateY(-50%) rotate(90deg); }

#joystick-knob {
    left: 50%;
    top: 50%;
    width: 76px;
    height: 76px;
    border: none;
    background: rgba(255, 255, 255, 0.88);
    box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.30),
        0 0 0 2px rgba(255, 255, 255, 0.25);
}

/* Death */
#death-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    opacity: 1;
    pointer-events: auto;
    transition: opacity 220ms ease;
}

#death-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

#death-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 44px 32px 40px;
    border-radius: 24px;
    background: rgba(10, 22, 32, 0.97);
    border: 2px solid rgba(255, 60, 60, 0.35);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0, 0, 0, 0.7),
        0 0 48px rgba(220, 40, 40, 0.12);
    min-width: min(340px, calc(100% - 32px));
    max-width: 520px;
    width: calc(100% - 40px);
}

/* Red top accent bar */
#death-content::before {
    content: '';
    display: block;
    width: 72px;
    height: 5px;
    border-radius: 99px;
    background: linear-gradient(90deg, #e83030, #ff6b6b);
    margin-bottom: 22px;
    box-shadow: 0 0 14px rgba(232, 48, 48, 0.65);
}

#death-title {
    color: #ff4444;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 48px;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    text-shadow:
        0 3px 0 rgba(0, 0, 0, 0.85),
        0 0 24px rgba(255, 50, 50, 0.45);
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.6);
    paint-order: stroke fill;
}

#respawn-btn {
    margin-top: 28px;
    width: 100%;
    height: 80px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(180deg, #3ec8f5 0%, #1a97dc 55%, #0e76b8 100%);
    color: #fff;
    font: 900 22px 'Orbitron', sans-serif;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow:
        0 7px 0 #0a5a92,
        0 12px 30px rgba(0, 0, 0, 0.45);
    touch-action: manipulation;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    animation: respawn-pulse 1.1s ease-in-out infinite;
    transition: background 120ms ease;
}

#respawn-btn:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #0a5a92, 0 5px 12px rgba(0,0,0,0.3);
    animation: none;
}

@keyframes respawn-pulse {
    0%, 100% { box-shadow: 0 7px 0 #0a5a92, 0 12px 30px rgba(0,0,0,0.45), 0 0 0 0 rgba(56,200,245,0); }
    50%       { box-shadow: 0 7px 0 #0a5a92, 0 12px 30px rgba(0,0,0,0.45), 0 0 0 8px rgba(56,200,245,0.18); }
}

@media (max-width: 560px), (max-height: 700px) {
    #leaderboard {
        width: 176px;
        padding: 8px 10px;
    }

    .leaderboard-entry {
        grid-template-columns: 18px minmax(0, 1fr) auto;
        font-size: 13px;
    }

    .leaderboard-mass {
        font-size: 13px;
        min-width: 34px;
    }

    #bottom-status {
        bottom: 42px;
        width: 200px;
    }

    #boost-track {
        width: 210px;
        height: 32px;
    }

    #mass-pill {
        height: 36px;
        min-width: 80px;
        padding: 0 16px;
    }

    #mass-value {
        font-size: 20px;
    }

    #boost-button {
        right: 20px;
        bottom: 70px;
        width: 148px;
        height: 148px;
    }

    #controls-hint {
        bottom: 130px;
        padding: 16px 20px;
    }

    .hint-line {
        font-size: 15px;
        line-height: 1.95;
    }

    .touch-mode #controls-hint {
        bottom: 170px;
    }


}

@media (prefers-reduced-motion: reduce) {
    #evolution-banner.show {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    #death-hint,
    #boost-fill.full {
        animation: none;
    }
}

/* ===== START SCREEN ===== */
#start-screen {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 32px 24px 40px;
    background: radial-gradient(ellipse at 50% 22%, #2f8fc4 0%, #14548a 40%, #041a33 100%);
}

#start-screen.hidden {
    display: none;
}

#game-world.hidden {
    visibility: hidden;
}

/* Decorative surface-light strip */
#start-screen::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;

#start-preview {

    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    color: rgba(216, 235, 240, 0.50);
    pointer-events: none;
    border: 2px solid transparent;
}

/* Current sea: strongest highlight */
.atlas-stage.current {
    background: rgba(47, 205, 229, 0.12);
    border-color: rgba(56, 220, 200, 0.65);
    color: rgba(238, 250, 252, 0.98);
}

/* Completed sea: subtle dark */
.atlas-stage.completed {
    background: rgba(9, 60, 50, 0.18);
    color: rgba(220, 240, 235, 0.88);
}

/* Locked/future sea: dimmed */
.atlas-stage.locked {
    opacity: 0.70;
}

.atlas-stage-marker {
    flex: 0 0 40px;
    display: grid;
    width: 40px;
    height: 40px;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    color: #9adce3;
    font: 900 16px 'Inter', sans-serif;
}

.atlas-stage.current .atlas-stage-marker {
    background: rgba(56, 220, 200, 0.20);
    color: #7ff0e0;
    font-size: 20px;
}

.atlas-stage.completed .atlas-stage-marker {
    background: rgba(9, 180, 120, 0.20);
    color: #5aea9a;
    font-size: 24px;
}

.atlas-stage.locked .atlas-stage-marker {
    background: rgba(255, 255, 255, 0.04);
    color: rgba(180, 210, 220, 0.50);
    font-size: 16px;
}

.atlas-stage-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.atlas-stage-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 800 17px 'Inter', sans-serif; line-height: 1.3; color: #ffffff; }
.atlas-stage-copy small { font: 700 14px 'Inter', sans-serif; line-height: 1.3; color: rgba(200, 230, 240, 0.70); }

.atlas-stage.current .atlas-stage-copy strong { color: #ffffff; }
.atlas-stage.completed .atlas-stage-copy strong { color: rgba(220, 245, 235, 0.90); }
.atlas-stage.locked .atlas-stage-copy strong { color: rgba(190, 215, 225, 0.60); }
.atlas-stage.locked .atlas-stage-copy small { color: rgba(170, 200, 215, 0.50); }

/* "ATUAL" badge */
.atlas-badge-current {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(56, 220, 200, 0.22);
    color: #7ff0e0;
    font: 900 11px 'Orbitron', sans-serif;
    letter-spacing: 1.5px;
    margin-right: 6px;
    vertical-align: middle;
}

#atlas-current { display: none; }
#atlas-note { display: none; }

#atlas-celebration {
    position: absolute;
    top: 31%;
    left: 50%;
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: min(88%, 520px);
    transform: translate(-50%, -50%) scale(0.86);
    opacity: 0;
    pointer-events: none;
    text-align: center;
}

#atlas-celebration.show { animation: atlas-discovery-pop 2.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
#atlas-celebration strong { color: #8af5f4; font: 900 17px 'Orbitron', sans-serif; letter-spacing: 2px; text-shadow: 0 2px 0 rgba(0,0,0,0.85), 0 0 22px rgba(83, 228, 237, 0.66); }
#atlas-celebration span { color: #fff; font: 900 34px/1 'Orbitron', sans-serif; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0,0,0,0.88), 0 0 30px rgba(124, 231, 245, 0.6); }
#atlas-celebration small { color: #ffe274; font: 900 16px 'Orbitron', sans-serif; letter-spacing: 2px; text-shadow: 0 2px 0 rgba(0,0,0,0.85); }
#atlas-celebration.complete strong, #atlas-celebration.complete small { color: #ffe274; }

@keyframes atlas-discovery-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
    13%, 72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -64%) scale(0.96); }
}

/* ===== MOBILE TUTORIAL HAND HINTS ===== */
.control-hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
    z-index: 100;
}

/* hint-used: hide individual hint when its control is first used */
.control-hint.hint-used {
    opacity: 0 !important;
    transition: opacity 200ms ease;
}

.control-hint .hint-label {
    display: none;
}

.control-hint .hint-hand {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
}

/* Show hints only in touch mode before game starts (unless individually dismissed) */
.touch-mode .tutorial-active .control-hint:not(.hint-used) {
    opacity: 1;
}

/* Joystick hand: drag animation (circular motion) */
.touch-mode .tutorial-active #joystick-hint .hint-hand {
    animation: hint-drag 2.0s ease-in-out infinite;
}

/* Boost hand: press-and-hold animation (tap down) */
.touch-mode .tutorial-active #boost-hint .hint-hand {
    animation: hint-press 1.8s ease-in-out infinite;
}

@keyframes hint-drag {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(12px, -8px); }
    50%  { transform: translate(0px, -14px); }
    75%  { transform: translate(-12px, -6px); }
    100% { transform: translate(0, 0); }
}

@keyframes hint-press {
    0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
    15%  { transform: translateY(6px) scale(0.9); opacity: 0.8; }
    50%  { transform: translateY(6px) scale(0.9); opacity: 0.8; }
    65%  { transform: translateY(0) scale(1); opacity: 1; }
}

/* ===== REGION TRANSITION OVERLAY ===== */
#region-transition {
    position: absolute;
    inset: 0;
    z-index: 180;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: rgba(2, 12, 24, 0.88);
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
}

#region-transition.show {
    opacity: 1;
    pointer-events: auto;
    animation: region-overlay-fade 4s ease forwards;
}

@keyframes region-overlay-fade {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; }
}

.region-transition-complete {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: region-section-up 0.8s ease-out 0.2s both;
}

.region-transition-check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(9, 215, 122, 0.18);
    border: 3px solid rgba(9, 215, 122, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #09d77a;
    font: 900 34px 'Inter', sans-serif;
    box-shadow: 0 0 28px rgba(9, 215, 122, 0.30);
}

.region-transition-prev-name {
    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(16px, 4vw, 28px);
    letter-spacing: 1px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: 640px;
    padding: 0 20px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 20px rgba(9, 215, 122, 0.3);
}

.region-transition-complete-label {
    color: rgba(9, 215, 122, 0.90);
    font: 800 16px 'Orbitron', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: 600px;
    padding: 0 10px;
    text-shadow: 0 0 12px rgba(9, 215, 122, 0.4);
}

.region-transition-divider {
    width: 120px;
    height: 2px;
    margin: 32px 0;
    background: linear-gradient(90deg, transparent, rgba(180, 240, 255, 0.45), transparent);
    animation: region-section-up 0.6s ease-out 0.5s both;
}

.region-transition-next {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: region-section-up 0.8s ease-out 0.7s both;
}

.region-transition-entering-label {
    color: rgba(180, 240, 255, 0.85);
    font: 700 15px 'Orbitron', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: 600px;
    padding: 0 20px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 18px rgba(80,200,240,0.3);
}

.region-transition-next-name {
    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 5.2vw, 38px);
    letter-spacing: 1px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: 660px;
    padding: 0 20px;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.6);
    paint-order: stroke fill;
    text-shadow:
        0 3px 0 rgba(0,0,0,0.85),
        0 0 36px rgba(120,230,255,0.50),
        0 0 72px rgba(80,200,240,0.25);
}

@keyframes region-section-up {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* ===== KING OF THE SEAS CELEBRATION ===== */
#king-celebration {
    position: absolute;
    inset: 0;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: radial-gradient(ellipse at 50% 40%, rgba(80, 56, 0, 0.92) 0%, rgba(10, 6, 2, 0.96) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
}

#king-celebration.hidden {
    display: none;
}

#king-celebration.show {
    opacity: 1;
    pointer-events: auto;
    animation: king-entrance 5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.king-crown {
    font-size: 110px;
    line-height: 1;
    filter: drop-shadow(0 0 40px rgba(255, 216, 74, 0.9)) drop-shadow(0 8px 20px rgba(0,0,0,0.7));
    animation: king-crown-float 2.5s ease-in-out infinite;
}

.king-title {
    color: #ffd84a;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 6vw, 46px);
    letter-spacing: 2px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(90vw, 560px);
    padding: 0 16px;
    -webkit-text-stroke: 2px rgba(0,0,0,0.8);
    paint-order: stroke fill;
    text-shadow:
        0 4px 0 rgba(0,0,0,0.88),
        0 0 48px rgba(255, 216, 74, 0.75),
        0 0 96px rgba(255, 200, 40, 0.35);
    animation: king-title-reveal 1.2s ease-out 0.4s both;
}

.king-subtitle {
    color: rgba(255, 240, 200, 0.85);
    font: 800 clamp(14px, 4vw, 22px) 'Orbitron', sans-serif;
    letter-spacing: 2px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(90vw, 520px);
    padding: 0 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 20px rgba(255, 210, 100, 0.3);
    animation: king-title-reveal 1.0s ease-out 0.8s both;
}

.king-reward {
    margin-top: 24px;
    padding: 14px 24px;
    border-radius: 14px;
    background: rgba(255, 216, 74, 0.15);
    border: 2px solid rgba(255, 216, 74, 0.55);
    color: #ffe78a;
    font: 900 clamp(13px, 3.5vw, 18px) 'Inter', sans-serif;
    letter-spacing: 1.5px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(88vw, 480px);
    text-shadow: 0 0 14px rgba(255, 216, 74, 0.6);
    box-shadow: 0 0 28px rgba(255, 200, 40, 0.20), inset 0 0 12px rgba(255, 200, 40, 0.08);
    animation: king-reward-pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.4s both;
}

.king-continue {
    margin-top: 12px;
    color: rgba(255, 244, 205, 0.62);
    font: 800 clamp(11px, 3vw, 13px) 'Inter', sans-serif;
    letter-spacing: 1.5px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(88vw, 480px);
    padding: 0 12px;
    animation: king-title-reveal 0.6s ease-out 1.5s both;
}

@keyframes king-entrance {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    88%  { opacity: 1; }
    100% { opacity: 0; }
}

@keyframes king-crown-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-8px) scale(1.05); }
}

@keyframes king-title-reveal {
    0%   { opacity: 0; transform: translateY(20px) scale(0.85); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes king-reward-pop {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
}

/* Atlas stage per-region progress bars */
.atlas-stage-bar {
    width: 100%;
    height: 14px;
    margin-top: 10px;
    border-radius: 99px;
    background: rgba(123, 233, 242, 0.14);
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(123,233,242,0.22) inset;
}

.atlas-stage-bar-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #31cde5, #7ff0c0);
    box-shadow: 0 0 10px rgba(82, 222, 230, 0.45);
    transition: width 400ms ease;
}

.atlas-stage-bar.complete .atlas-stage-bar-fill {
    background: linear-gradient(90deg, #7ff0c0, #ffe052);
    box-shadow: 0 0 10px rgba(255, 224, 82, 0.45);
}

/* Final reward row — neutral when locked, gold when unlocked */
.atlas-stage.king {
    margin-top: 8px;
    height: 72px;
}

.atlas-stage.king.locked {
    background: rgba(255, 255, 255, 0.03);
    border-color: transparent;
    opacity: 0.70;
}

.atlas-stage.king.locked .atlas-stage-marker {
    background: rgba(255, 200, 40, 0.08);
    color: rgba(200, 170, 80, 0.55);
    font-size: 20px;
}

.atlas-stage.king.locked .atlas-stage-copy strong {
    color: rgba(200, 200, 180, 0.60);
}

.atlas-stage.king.locked .atlas-stage-copy small {
    color: rgba(180, 180, 160, 0.45);
}

.atlas-stage.king.unlocked {
    border-color: rgba(255, 216, 74, 0.75);
    background: rgba(255, 200, 40, 0.14);
    box-shadow: 0 0 22px rgba(255, 200, 40, 0.15);
    opacity: 1;
}

.atlas-stage.king.unlocked .atlas-stage-marker {
    background: rgba(255, 200, 40, 0.28);
    color: #ffd84a;
    font-size: 24px;
}

.atlas-stage.king.unlocked .atlas-stage-copy strong {
    color: #ffd84a;
    text-shadow: 0 0 12px rgba(255, 216, 74, 0.30);
}

.atlas-stage-marker.crown-muted {
    filter: grayscale(0.6) opacity(0.6);
}

/* ===== SWAP CONTROLS BUTTON (now inside settings overlay) ===== */
#swap-controls {
    display: none !important;
}

/* Swapped layout */
.touch-mode.controls-swapped #joystick-container {
    left: auto !important;
    right: calc(30px + env(safe-area-inset-right, 0px)) !important;
    bottom: calc(104px + env(safe-area-inset-bottom, 0px)) !important;
}

.touch-mode.controls-swapped #boost-button {
    right: auto;
    left: calc(30px + env(safe-area-inset-left, 0px));
    bottom: calc(104px + env(safe-area-inset-bottom, 0px));
}



.touch-mode.controls-swapped #sound-toggle {
    right: auto;
    left: calc(30px + env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 80px;
    height: 52px;
    font-size: 26px;
}

/* ===== DEATH SCREEN — OCEAN ATLAS BUTTON ===== */
#death-atlas-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    height: 92px;
    margin-top: 20px;
    padding: 0 24px;
    border: 3px solid rgba(49, 205, 229, 0.80);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(14, 62, 82, 0.97) 0%, rgba(6, 34, 52, 0.99) 100%);
    color: #7ff0c0;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow:
        0 6px 0 rgba(4, 40, 58, 0.95),
        0 10px 26px rgba(0, 0, 0, 0.50),
        0 0 24px rgba(49, 205, 229, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 80ms ease;
}

#death-atlas-btn:hover {
    background: linear-gradient(135deg, rgba(18, 72, 92, 0.97) 0%, rgba(10, 46, 64, 0.99) 100%);
    border-color: rgba(82, 230, 245, 0.88);
    box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.55),
        0 0 36px rgba(49, 205, 229, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
    color: #b8fbec;
}

#death-atlas-btn:active {
    transform: translateY(5px);
    box-shadow:
        0 1px 0 rgba(4, 40, 58, 0.95),
        0 3px 8px rgba(0, 0, 0, 0.30),
        inset 0 2px 4px rgba(0, 0, 0, 0.20);
}

.death-atlas-btn-icon {
    font-size: 36px;
    line-height: 1;
    flex-shrink: 0;
}

.death-atlas-btn-text {
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 0 0 14px rgba(127, 240, 192, 0.50);
    flex: 1;
    text-align: left;
}

.death-atlas-btn-pct {
    font-size: 26px;
    letter-spacing: 1px;
    color: #ffe052;
    text-shadow: 0 0 14px rgba(255, 224, 82, 0.55);
    flex-shrink: 0;
}

/* Sea progress bar completion blink (3 flashes at 100%) */
#sea-progress-button.complete-blink .sea-progress-track {
    animation: sea-complete-blink 0.4s ease-in-out 3;
}

@keyframes sea-complete-blink {
    0%, 100% { opacity: 1; border-color: rgba(56, 212, 244, 0.45); box-shadow: 0 3px 10px rgba(0,0,0,0.50), inset 0 1px 0 rgba(180,230,255,0.08); }
    50% { opacity: 0.3; border-color: rgba(255, 255, 255, 0.90); box-shadow: 0 3px 10px rgba(0,0,0,0.50), inset 0 1px 0 rgba(180,230,255,0.08), 0 0 24px rgba(255,255,255,0.55); }
}

/* ===== SEA COMPLETION CEREMONY ANIMATIONS ===== */

/* Gold pulse animation on the track border during celebration */
#sea-progress-button.sea-completing .sea-progress-track {
    animation: sea-ceremony-gold-pulse 0.35s ease-in-out 2;
}

#sea-progress-button.sea-completing-final .sea-progress-track {
    animation: sea-ceremony-gold-pulse 0.23s ease-in-out 3;
}

@keyframes sea-ceremony-gold-pulse {
    0%, 100% {
        border-color: rgba(255, 216, 74, 0.60);
        box-shadow: 0 4px 14px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(180,230,255,0.10);
    }
    50% {
        border-color: rgba(255, 240, 160, 1);
        box-shadow: 0 4px 14px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,200,0.30), 0 0 24px rgba(255, 216, 74, 0.65);
    }
}

/* Left-to-right shimmer sweep across the bar */
#sea-progress-button.sea-completing .sea-progress-track::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 240, 180, 0.50) 42%,
        rgba(255, 255, 230, 0.75) 50%,
        rgba(255, 240, 180, 0.50) 58%,
        transparent 100%
    );
    animation: sea-ceremony-shimmer 0.7s ease-in-out forwards;
}

#sea-progress-button.sea-completing-final .sea-progress-track::after {
    background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 230, 100, 0.65) 38%,
        rgba(255, 255, 220, 0.95) 50%,
        rgba(255, 230, 100, 0.65) 62%,
        transparent 100%
    );
    animation: sea-ceremony-shimmer 0.85s ease-in-out forwards;
}

@keyframes sea-ceremony-shimmer {
    0%   { transform: translateX(-120%); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
}

/* Fill turns gold during completion ceremony */
#sea-progress-button.sea-completing #sea-progress-fill {
    background: linear-gradient(90deg, #c89a18, #ffd84a, #ffe88a) !important;
    width: 100% !important;
}

/* Medallion shows checkmark during ceremony */
#sea-progress-button.sea-completing .sea-progress-compass::before,
#sea-progress-button.sea-completing .sea-progress-compass::after {
    display: none;
}

#sea-progress-button.sea-completing .sea-progress-medallion {
    border-color: rgba(255, 216, 74, 0.90);
    background: linear-gradient(160deg, rgba(60, 44, 4, 0.99) 0%, rgba(30, 18, 2, 0.99) 100%);
    box-shadow:
        0 6px 0 rgba(50, 30, 0, 0.90),
        0 8px 18px rgba(0, 0, 0, 0.60),
        0 0 18px rgba(255, 216, 74, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

#sea-progress-button.sea-completing .sea-progress-medallion::after {
    content: '✓';
    position: absolute;
    color: #7ff0c0;
    font: 900 24px 'Inter', sans-serif;
    text-shadow: 0 0 10px rgba(127, 240, 192, 0.70);
}

/* Label styling during ceremony — "CONCLUÍDO" is smaller, muted */
#sea-progress-button.sea-completing #sea-progress-percent {
    color: rgba(255, 240, 200, 0.92);
    font-size: 13px;
    letter-spacing: 1.5px;
}

/* Region transition overlay — shorter duration variant for ceremony */
#region-transition.ceremony-transition {
    animation: region-overlay-ceremony 2.2s ease forwards;
}

@keyframes region-overlay-ceremony {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    50%  { opacity: 1; } /* darkest midpoint — theme switches here */
    82%  { opacity: 1; }
    100% { opacity: 0; }
}

/* Reduced motion: disable ceremony animations gracefully */
@media (prefers-reduced-motion: reduce) {
    #sea-progress-button.sea-completing .sea-progress-track,
    #sea-progress-button.sea-completing-final .sea-progress-track {
        animation: none;
        border-color: rgba(255, 216, 74, 0.90);
        box-shadow: 0 4px 14px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.4), 0 0 18px rgba(255, 216, 74, 0.40);
    }
    #sea-progress-button.sea-completing .sea-progress-track::after,
    #sea-progress-button.sea-completing-final .sea-progress-track::after {
        animation: none;
        display: none;
    }
    #region-transition.ceremony-transition {
        animation: none;
        opacity: 1;
    }
}

/* ===== SEA COMPLETION CEREMONY — 4.5s overlay text ===== */
.ceremony-text-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 0 28px;
}

.ceremony-line-1 {
    color: rgba(127, 240, 192, 0.92);
    font: 900 clamp(13px, 3.5vw, 22px) 'Orbitron', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(90vw, 560px);
    padding: 0 12px;
    text-shadow: 0 0 20px rgba(127, 240, 192, 0.50), 0 2px 4px rgba(0, 0, 0, 0.90);
    opacity: 0;
    transform: translateY(12px);
    animation: ceremony-line-in 600ms ease-out 200ms forwards;
}

.ceremony-line-2 {
    color: #ffffff;
    font: 900 clamp(22px, 6.5vw, 52px) 'Orbitron', sans-serif;
    letter-spacing: 1px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(90vw, 600px);
    padding: 0 16px;
    -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.7);
    paint-order: stroke fill;
    text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.88),
        0 0 40px rgba(56, 212, 244, 0.55),
        0 0 80px rgba(56, 212, 244, 0.25);
    opacity: 0;
    transform: translateY(14px) scale(0.92);
    animation: ceremony-line-main-in 700ms cubic-bezier(0.22, 1, 0.36, 1) 350ms forwards;
}

.ceremony-line-3 {
    color: rgba(220, 244, 255, 0.90);
    font: 800 clamp(16px, 4vw, 26px) 'Inter', sans-serif;
    letter-spacing: 1px;
    text-align: center;
    white-space: normal;
    word-break: normal; overflow-wrap: normal;
    max-width: min(90vw, 540px);
    padding: 0 12px;
    text-shadow: 0 0 18px rgba(180, 230, 255, 0.40), 0 2px 4px rgba(0, 0, 0, 0.85);
    opacity: 0;
    transform: translateY(10px);
    animation: ceremony-line-in 600ms ease-out 550ms forwards;
}

@keyframes ceremony-line-in {
    0%   { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
}

@keyframes ceremony-line-main-in {
    0%   { opacity: 0; transform: translateY(14px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Reduced motion: skip line entrance animations */
@media (prefers-reduced-motion: reduce) {
    .ceremony-line-1,
    .ceremony-line-2,
    .ceremony-line-3 {
        animation: none;
        opacity: 1;
        transform: none;
    }
}
</style>
<script src="local-config.js"></script><script src="local-host.js"></script></head>
<body>
<div id="start-screen">
<div id="start-title">Narwhal.io</div>
<div id="start-preview">
<div id="start-tagline">SWIM • TUSK • EVOLVE</div>
</div>
<div id="start-loading-bar">
<div id="start-loading-fill"></div>
</div>
<div id="start-status">Loading...</div>
<button disabled="" id="start-play-btn" type="button">PLAY</button>
</div>
<div class="hidden" id="game-world">
<canvas id="game-canvas"></canvas>
<button id="sea-progress-button" type="button">
<span class="sea-progress-track">
<span id="sea-progress-fill"></span>
</span>
<span aria-hidden="true" class="sea-progress-medallion">
<span class="sea-progress-compass"></span>
</span>
<span id="sea-progress-label">MAR 1</span>
<span id="sea-progress-percent">0%</span>
<span aria-hidden="true" class="sea-progress-chevron">›</span>
</button>
<button aria-label="Settings" id="sound-toggle" type="button">⚙️</button>
<div class="hidden" id="settings-overlay">
<div id="settings-backdrop"></div>
<div id="settings-card">
<div class="settings-title">⚙️ SETTINGS</div>
<div class="settings-section">
<div class="settings-row">
<span class="settings-row-icon">🎵</span>
<span class="settings-row-label">Music</span>
<input class="sound-slider" id="music-volume-slider" max="100" min="0" type="range" value="100"/>
<span class="settings-row-val" id="music-vol-val">100</span>
</div>
<div class="settings-row">
<span class="settings-row-icon">💥</span>
<span class="settings-row-label">SFX</span>
<input class="sound-slider" id="sfx-volume-slider" max="100" min="0" type="range" value="100"/>
<span class="settings-row-val" id="sfx-vol-val">100</span>
</div>
</div>
<div class="settings-section">
<button class="settings-action-btn" id="settings-swap-btn" type="button">
<span class="settings-action-icon">🕹️</span>
<span class="settings-action-text">Inverter Joystick</span>
<span class="settings-action-status" id="settings-swap-status">OFF</span>
</button>
</div>
<div class="settings-section">
<button class="settings-action-btn" id="settings-atlas-btn" type="button">
<span class="settings-action-icon">🗺️</span>
<span class="settings-action-text">Ocean Atlas</span>
<span class="settings-action-status" id="settings-atlas-pct">0%</span>
</button>
</div>
<button id="settings-close-btn" type="button">▶ CONTINUAR</button>
</div>
</div>
<button aria-label="Ocean Atlas" id="atlas-toggle" type="button">
<div id="atlas-toggle-fill"></div>
<span class="atlas-toggle-label">ATLAS</span>
<span class="atlas-toggle-value">0%</span>
</button>
<div aria-hidden="true" aria-label="Ocean Atlas" class="hidden" id="atlas-panel">
<div id="atlas-panel-backdrop"></div>
<div id="atlas-panel-card">
<button aria-label="Close" id="atlas-close" type="button">×</button>
<div class="atlas-panel-kicker">OCEAN ATLAS</div>
<div id="atlas-percent">0%</div>
<div class="atlas-progress-track"><div id="atlas-progress-fill"></div></div>
<div id="atlas-current"></div>
<div id="atlas-stages"></div>
<p id="atlas-note"></p>
</div>
</div>
<div aria-live="polite" id="atlas-celebration"></div>
<div aria-live="polite" class="hidden" id="king-celebration"></div>
<div aria-live="polite" id="region-transition"></div>
<section aria-label="Top five narwhals" id="leaderboard">
<div id="leaderboard-title">RANKING</div>
<div id="leaderboard-entries"></div>
</section>
<div aria-label="Mass and boost energy" id="bottom-status">
<div id="mass-pill">
<span id="mass-value">5</span>
</div>
<div id="boost-track">
<span id="boost-bar-label">⚡</span>
<div id="boost-fill"></div>
</div>
</div>
<button aria-label="Hold to boost" id="boost-button" type="button">
<span aria-hidden="true" class="boost-button-icon">⚡</span>
<span class="boost-button-text">BOOST</span>
<div class="control-hint" id="boost-hint">
<div class="hint-label">Hold to boost</div>
<div class="hint-hand">👆</div>
</div>
</button>
<div aria-live="polite" id="controls-hint"></div>
<div aria-live="polite" id="evolution-banner">
<span id="evolution-tier">STAGE 2!</span>
<strong id="evolution-name">GUPPY</strong>
</div>
<div aria-live="polite" id="powerup-status">
<span>⭐ SPEED BOOST</span>
<strong id="powerup-time"></strong>
</div>
<div aria-live="polite" id="alpha-hunt-status">
<span class="alpha-hunt-track">
<span id="alpha-hunt-fill"></span>
</span>
<span aria-hidden="true" class="alpha-hunt-medallion">
<span class="alpha-hunt-crown-icon"></span>
</span>
<span id="alpha-hunt-label"></span>
<div id="alpha-hunt-bonus"></div>
</div>
<div aria-live="polite" id="alpha-hunt-announce">
<div id="alpha-announce-title"></div>
<div id="alpha-announce-sub"></div>
</div>
<div aria-live="polite" id="alpha-hunt-result"></div>
<div aria-hidden="true" class="hidden" id="joystick-container">
<div id="joystick-base">
<span class="joy-arrow joy-left">▲</span>
<span class="joy-arrow joy-right">▲</span>
</div>
<div id="joystick-knob"></div>
<div class="control-hint" id="joystick-hint">
<div class="hint-label">Drag to move</div>
<div class="hint-hand">👆</div>
</div>
</div>
<button aria-label="Swap controls" id="swap-controls" type="button">🕹️</button>
<div class="hidden" id="death-overlay">
<div id="death-content">
<div id="death-title">TUSKED!</div>
<div id="death-stats">
<div class="death-stat">
<span class="death-stat-label">Score</span>
<span class="death-stat-value" id="final-mass">0</span>
</div>
<div class="death-stat">
<span class="death-stat-label">Kills</span>
<span class="death-stat-value" id="death-run-kills">0</span>
</div>
</div>
<div id="death-record-line">
<span id="death-record-label">Record:</span>
<span id="death-best-mass">0</span>
</div>
<div id="death-total-line">
<span id="death-total-label">Lifetime total:</span>
<span id="death-total-score">0</span>
</div>

<span class="death-atlas-btn-icon">🗺️</span>
<span class="death-atlas-btn-text">OCEAN ATLAS</span>

</button>
<div id="death-atlas-bar-container">
<div id="death-atlas-bar-fill"></div>
</div>
<button id="respawn-btn" type="button">RESPAWN</button>
</div>
</div>
</div>
