<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>地铁跑酷</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game"></canvas>
<header><div class="brand"><b>地铁跑酷</b></div><div class="stats"><div><small>距离</small><strong id="score">0 m</strong></div><div class="coin-stat"><i class="coin-icon" aria-hidden="true"></i><div><small>金币</small><strong id="coins">0</strong></div></div></div></header>
<button id="sound" aria-label="切换声音" aria-pressed="false">声音：开</button><aside id="hint">← → 换道 · ↑ 跳跃 · ↓ 滑行</aside>
<section id="overlay" aria-labelledby="title"><div class="panel"><div class="cover" aria-hidden="true"><img src="assets/ui/cover.png" alt=""><span>地铁跑酷</span></div><div class="panel-body"><h1 id="title">准备开跑！</h1><p id="description">穿过街区，跃过路障。<br>看看这一程能跑多远！</p><div id="run-result" hidden><div><small>本次距离</small><strong><span id="result-distance">0</span><em>米</em></strong></div><div><small>收集金币</small><strong><i class="coin-icon" aria-hidden="true"></i><span id="result-coins">0</span></strong></div></div><div class="howto"><span><kbd>← →</kbd>换道</span><span><kbd>↑</kbd>跳跃</span><span><kbd>↓</kbd>滑行</span></div><p class="touch-tip">手机滑动屏幕，也可点击方向按钮</p><div id="load" role="status">正在加载游戏资源…</div><button id="start" disabled>加载中</button></div></div></section>
<nav id="controls" aria-label="游戏操作"><button data-action="left" aria-label="向左">←</button><button data-action="jump" aria-label="跳跃">↑</button><button data-action="slide" aria-label="滑行">↓</button><button data-action="right" aria-label="向右">→</button></nav><footer id="asset-note" hidden></footer><script type="module" src="game.js"></script></body></html>
