    <script>
        window.addEventListener("load", function () {
            function onTouchPreventDefault(event) {
                event.preventDefault();
            }
            document.addEventListener("touchmove", onTouchPreventDefault, false);
            document.addEventListener("touchstart", onTouchPreventDefault, false);}, false);
    </script>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #071D2B;
        overflow: hidden;
        position: relative;
        touch-action: none;
        -ms-touch-action: none;

        -webkit-touch-callout: none !important;                /* prevent callout to copy image, etc when tap to hold */
        -webkit-text-size-adjust: none !important;             /* prevent webkit from resizing text to fit */

    }
</style>
