<!DOCTYPE html>
<html>
    <head>
        <title>FOOSBALL</title>
        

        <link rel="stylesheet" href="css/reset.css" type="text/css">
        <link rel="stylesheet" href="css/main.css" type="text/css">
        <link rel="stylesheet" href="css/orientation_utils.css" type="text/css">
        <link rel="stylesheet" href="css/ios_fullscreen.css" type="text/css">
        
        
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
	<meta name="msapplication-tap-highlight" content="no"/>
        
        
        


        
        <script type="text/javascript" src="js/jquery-3.2.1.min.js"></script>
        <script type="text/javascript" src="js/createjs.min.js"></script>
        <script type="text/javascript" src="js/howler.min.js"></script>
        <script type="text/javascript" src="js/screenfull.min.js"></script>
        <script type="text/javascript" src="js/CLang.min.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    <link rel="icon" href="sprites/200x200.jpg">
</head>
    <body ondragstart="return false;" ondrop="return false;" >
	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          
        
        <div class="check-fonts">
            <p class="check-font-1">test 1</p>
        </div> 
        
        <canvas id="canvas" class='ani_hack' width="1920" height="1080"> </canvas>
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>

    <script>
var s_bGameStarted = false;
function startGame() {
  if (s_bGameStarted) {
    return;
  }
  s_bGameStarted = true;
  var oMain = new CMain({
    fullscreen: true,
    //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
    check_orientation: true,
    //SET TO FALSE IF YOU DON'T WANT TO SHOW ORIENTATION ALERT ON MOBILE DEVICES   
    level_menu_rows: 1,
    //SET NUM ROW ON LEVEL MENU 
    level_menu_cols: 5,
    //SET NUM COLS ON LEVEL MENU
    num_goal_friendly: 5,
    //SET NUM GOAL FOR WIN IN FRIENDLY MODE
    cpu_speed_friendly: 5,
    //SET CPU MOVEMENT SPEED, 10 = YOUR MOVEMENT SPEED
    audio_enable_on_startup: false //ENABLE/DISABLE AUDIO WHEN GAME STARTS 
  });
  document.addEventListener("ad_complete", function (evt) {
    s_oMain.startUpdate();
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  document.addEventListener("ad_error", function (evt) {
    s_oMain.startUpdate();
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  document.addEventListener("ad_not_complete", function (evt) {
    s_oMain.startUpdate();
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  document.addEventListener("ad_loaded", function (evt) {
    if (evt.detail.reward) {
      s_bRewardAvailable = true;
    }
  });
  document.addEventListener("ad_not_loaded", function (evt) {
    s_oMain.startUpdate();
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  document.addEventListener("ad_complete", function (evt) {
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  document.addEventListener("ad_error", function (evt) {
    if (evt.detail.cb) {
      evt.detail.cb();
    }
  });
  if (isIOS()) {
    setTimeout(function () {
      sizeHandler();
    }, 200);
  } else {
    sizeHandler();
  }
}
$(document).ready(function(){startGame();});
</script>
</body>
</html>
