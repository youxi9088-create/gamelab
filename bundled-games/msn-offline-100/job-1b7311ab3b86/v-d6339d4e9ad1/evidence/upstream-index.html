<!DOCTYPE html>

<html>
    <head>
        <title>CYCLE SPRINT</title>
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="css/reset.css" type="text/css">
        <link rel="stylesheet" href="css/main.css" type="text/css">
        <link rel="stylesheet" href="https://api.codethislab.com/mstart/moregames.css" type="text/css">
        <link rel="stylesheet" href="css/orientation_utils.css" type="text/css">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
	<meta name="msapplication-tap-highlight" content="no"/>

        <script>
            var s_bApiReady=false;
            var s_bDOMReady = false;
            document.addEventListener("api_ready", function(evt) {
                    console.log("api_ready")
                    s_bApiReady = true;
                    if(s_bDOMReady){
                        loadSw();
                    }
                });

        </script>
        <script type="text/javascript" src="https://mstart.codethislab.com/games/mstartApiController.js"></script>

        <script type="text/javascript" src="js/easeljs-NEXT.min.js"></script>
        <script type="text/javascript" src="js/howler.min.js"></script>
        <script type="text/javascript" src="https:///api.codethislab.com/mstart/mstart_moregames.js"></script>
        <script type="text/javascript" src="js/CLang.min.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </head>
    

    
    <body ondragstart="return false;" ondrop="return false;" >
	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          <script>

             function startGame(){
                    if(s_bAPILoaded){

                            var oData = {
                            gameId: "CodeThisLabs.r.l.CycleSprint-CTLMStart",
                            gameName: "Cycle Sprint - CTL MStart",
                            title: "Cycle Sprint",
                            description: "Test your cycling skills in this thrilling racing game!",
                            type:0,
                            payload: "",
                            imageData: "https://mstart.codethislab.com/games/cycle_sprint/360x180.png",
                            callToAction: "PLAY NOW!",
                            minDelayInSeconds: 604800
                          };

                          scheduleNotificationAsync(oData );

                    }
                    var oMain = new CMain({
                                                leaderboard_points: [50,35,25,18,14,12,10,8,7,6,5,4,3,2,1],    //POINTS ASSIGNED FOR FIRST 15 CYCLIST
                                                fullscreen: true,         //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
                                                check_orientation: true,  //SET TO FALSE IF YOU DON'T WANT TO SHOW ORIENTATION ALERT ON MOBILE DEVICES
                                                audio_enable_on_startup: false  //ENABLE/DISABLE AUDIO WHEN GAME STARTS 
                                           });
					 
                    if(isIOS()){ 
                        setTimeout(function(){sizeHandler();},200); 
                    }else{
                        sizeHandler(); 
                    } 
                    
                    document.addEventListener("start_session", function(evt) {
                           
                    });
                     
                    document.addEventListener("end_session", function(evt) {
                          
                    });

                    document.addEventListener("restart_level", function(evt, iLevel) {
                           
                    });

                    document.addEventListener("start_level", function(evt, iLevel) {
                          
                    });

                    document.addEventListener("end_level", function(evt,iLevel) {
                         
                    });
                    					
                    document.addEventListener("save_score", function(evt) {
                           saveScore(evt.detail.score);
                    });

                    document.addEventListener("show_interlevel_ad", function(evt) {
                       callAd();
                    });
                    
                    document.addEventListener("share_event", function(evt, iScore) {
                           
                    });
                    
                    document.addEventListener("status_online", function(evt) { 	 
                        
                    });

              }

              function loadSw(){
                  if ("serviceWorker" in navigator) {
                        // Register a service worker hosted at the root of the
                        // site using the default scope.
                        navigator.serviceWorker.register("./sw.js" ).then(
                        (registration) => {
                            console.log("Service worker registration succeeded:", registration);
                            startGame();

                        },
                        (error) => {
                            console.error(`Service worker registration failed: ${error}`);
                            startGame();
                          }
                        );
                    } else {
                        console.error("Service workers are not supported.");
                        startGame();
                    }
              }

            document.addEventListener("DOMContentLoaded", () =>{
                    s_bDOMReady = true;
                    if(s_bApiReady){
                        loadSw();
                    }

                                         
           });

        </script>
        
        <div class="check-fonts">
            <p class="check-font-1">montserratextrabold_italic</p>
        </div> 

        <canvas id="canvas" class='ani_hack' width="1360" height="768"> </canvas>

        
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>

    </body>
</html>
