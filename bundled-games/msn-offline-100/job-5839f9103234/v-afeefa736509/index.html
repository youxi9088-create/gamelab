    <title>Ski Jump FRVR</title>
    <style>
      body {
        background: #c8c8c8;
        overflow: hidden;
        position: fixed;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        border: 0px;
        padding: 0px;
        margin: 0px;
        width: 100%;
        height: 100%;
        padding-top: constant(safe-area-inset-top);
        overscroll-behavior: none;
      }

      preloader {
        display: block;
        width: 100%;
        height: 100%;
        background: #fefefe;
        position: fixed;
        z-index: 5;
      }
      preloader.dark {
        background: #1c1c1c;
      }
      preloader canvas,
      preloader img {
        position: fixed;
      }
      preloader loadbar {
        display: none;
        position: fixed;
        border: 1px solid #a4a4a4;
        border-radius: 3px;
        overflow: hidden;
      }
      preloader loadbar div {
        display: block;
        width: 0%;
        height: 100%;
        background-color: #02bdff;
      }

      iframe {
        border: 0px;
        width: 100%;
        height: 100%;
      }

      #gameCanvas {
        position: fixed;
        top: 0px;
        left: 0px;
        width: 0px;
        height: 0px;
        background-color: #000000;
      }

      #overlay {
        position: absolute;
        z-index: 3;
        left: 50%;
        transform: translate(-50%, -50%);
        visibility: hidden;
        bottom: 3px;
        overflow: hidden;
        text-align: center;
      }
      #overlay div {
        float: left;
      }
    </style>
    <meta
      name="description"
      content="Speed down the in-run and tap at the right moment to launch your jump. In the air, use the rotation buttons to keep a good angle against the wind, because leaning too far means a crash. Every jump earns coins and is measured against a ghost of your best attempt. Spend coins on faster skis with more lift and on boosts for the in-run or the flight, and spin the prize wheel every few jumps for extra rewards."

      #frvr-loader-preloader {
        position: fixed;
        z-index: 999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
        box-sizing: border-box;
      }

      #frvr-loader-container {
        width: 100%;
        max-width: 750px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      #frvr-loader-logo {
        width: 100%;
        height: auto;
        max-height: 100%;
        flex-shrink: 1;
      }

      #frvr-loader-loadbar {
        width: 100%;
        height: 16px;
        border: 1px solid #000;
        border-radius: 3px;
        overflow: hidden;
        flex-shrink: 0;
      }

      #frvr-loader-progressbar {
        display: block;
        height: 100%;
        width: 0%;
        background-color: #02bdff;
      }
