<!DOCTYPE html>
<html>
  <head>
    <title>Touch And Catch: Santa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimal-ui">
    <link rel="icon" type="image/GIF" href="icon.ico">
    <link rel="apple-touch-icon" href="icon_60x60.png">
    <link rel="apple-touch-icon" sizes="76x76" href="icon_76x76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icon_120x120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon_152x152.png">
    <style type="text/css">
      body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        text-align: center;
        font-family: Arial, Helvetica, Verdana;
        background-color: #003366;
      }
      img#splashScreenImage {
        display: none;
        position: absolute;
      }
      div#preloaderContainer {
        position: absolute;
        width: 50%;
        top: 50%;
        left: 25%;
        border: 3px solid #ffffff;
        border-radius: 5px;
        padding: 2px;
        text-align: left;
      }
      div#preloaderIndicator {
        background-color: #ffffff;
        height: 7px;
        width: 1%;
      }
      div#rotateScreenDiv {
        display: none;
        position: absolute;
        width: 100%;
        height: 101%;
        background-color: #003366;
      }
      div#rotateScreenDiv img {
        height: 100%;
      }
    </style>
    <script type="text/javascript">
      window.gameLangs = ['en', 'de', 'es', 'fr', 'it', 'pt', 'ru', 'tr', 'pl', 'nl'];
      window.gameJS = ['tcsb.min.js'];
      window.gameOnLoadScript = "";
    </script>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <img id="splashScreenImage" src="assets/images/splash-screen-image.jpg">
    <div id="preloaderContainer">
      <div id="preloaderIndicator"></div>
    </div>
    <div id="rotateScreenDiv"><img src="assets/images/rotate-screen-image.jpg"></div>
    <script id="wrapperReady">
      window.onWrapperReady = () => {
        handlerDocumentLoad();
      }
    </script>
    <script src="https://scripts.gd.sbs.softgames.de/sdk/platform-wrapper/SGAVO-2.x.min.js"></script>
    <script src="https://scripts.gd.sbs.softgames.de/sdk/platform-wrapper/MSStartLoader.min.js"></script>
  </body>
</html>
