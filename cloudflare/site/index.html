<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Lab · 迁移试运行</title><style>body{font:15px/1.65 system-ui,sans-serif;background:#f5f7fa;color:#1f2937;max-width:1080px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.notice{padding:16px;background:#fff4d9;border:1px solid #ead297;border-radius:10px}.box{padding:24px;background:white;border:1px solid #dbe2ea;border-radius:12px;margin-top:20px}label{display:block;margin-top:12px}input{padding:10px;border:1px solid #bec8d5;border-radius:6px;width:260px;max-width:80%}button,.button{display:inline-block;background:#175bcc;color:white;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;text-decoration:none;margin-top:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8edf4}small{color:#64748b}#error{color:#a12525}#logout{background:#42536c}[hidden]{display:none!important}</style></head><body><header><h1>Game Lab · 迁移试运行</h1><button id="logout" hidden>退出登录</button></header><div class="notice">这是迁移第一阶段：验证账号、历史数据查询与私有 R2 试玩。任务派发、自动转换和验收操作尚未迁移。旧站未停用，不能把此页面当作完整平台。</div><section class="box" id="login-panel"><h2>账号登录</h2><form id="login"><label>账号 <input id="username" autocomplete="username" required></label><label>密码 <input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p id="error" role="alert"></p><small>登录哈希已按免费版 CPU 上限降为 5000 轮 PBKDF2（原 60 万轮无法在 10ms 内完成）；迁移后账号密码需重新设置。</small></section><section id="content" hidden><div class="box"><h2>交付版本</h2><p id="identity"></p><table><thead><tr><th>游戏 / 版本</th><th>原版本状态</th><th>试玩</th></tr></thead><tbody id="versions"></tbody></table></div><div class="box"><h2>任务记录（只读）</h2><table><thead><tr><th>任务</th><th>状态 / 阶段</th><th>原因</th></tr></thead><tbody id="jobs"></tbody></table><small>历史记录保留；此页面没有“验收通过”或“发布”操作。</small></div></section><script type="module" src="/app.mjs"></script></body></html>
